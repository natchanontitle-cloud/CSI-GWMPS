น<\/span><\/button>\n\n  <section class=\"kpis\" id=\"kpis\"><\/section>\n\n  <section class=\"panel\">\n    <div class=\"phead\">\n      <div><h2>อันดับปัญหารายข้อ<\/h2><p id=\"rankSub\"><\/p><\/div>\n      <div class=\"ctrls\">\n        <div class=\"seg\" id=\"metricSeg\">\n          <button data-v=\"count\" aria-pressed=\"true\">จำนวนเคส<\/button>\n          <button data-v=\"score\" aria-pressed=\"false\">คะแนน CSI %<\/button>\n        <\/div>\n        <div class=\"seg\" id=\"sortSeg\">\n          <button data-v=\"desc\" aria-pressed=\"true\">มาก → น้อย<\/button>\n          <button data-v=\"asc\" aria-pressed=\"false\">น้อย → มาก<\/button>\n          <button data-v=\"q\" aria-pressed=\"false\">ตามข้อ<\/button>\n        <\/div>\n      <\/div>\n    <\/div>\n    <div class=\"chartbox\"><div class=\"vchart\" id=\"rankChart\"><\/div><\/div>\n    <div class=\"legend\" id=\"rankLegend\"><\/div>\n    <div class=\"rankline\" id=\"rankLine\"><\/div>\n  <\/section>\n\n  <section class=\"panel\">\n    <div class=\"phead\"><div><h2>วิธีคำนวณคะแนน CSI และ NPS<\/h2><p>Happy = คะแนน 4–5 · Neutral = 3 · Unhappy = 1–2 · ลูกค้า 1 คนนับ 1 ครั้งต่อข้อ<\/p><\/div><\/div>\n    <div class=\"formulas\">\n      <div class=\"fbox\"><span class=\"fname\">คะแนน CSI แต่ละข้อ =<\/span><span class=\"frac\"><span>Happy − Unhappy<\/span><span>จำนวนลูกค้าที่ถูกสำรวจ<\/span><\/span><span>× 100%<\/span><\/div>\n      <div class=\"fbox\"><span class=\"fname\">คะแนน CSI โดยรวม =<\/span><span class=\"frac\"><span>ผลคะแนน CSI ข้อ 1 ถึง 8<\/span><span>8<\/span><\/span><\/div>\n      <div class=\"fbox\"><span class=\"fname\">คะแนน NPS (Q9) =<\/span><span class=\"frac\"><span>Happy − Unhappy<\/span><span>จำนวนลูกค้าที่ถูกสำรวจ<\/span><\/span><span>× 100%<\/span><\/div>\n    <\/div>\n    <div class=\"tblwrap\"><table id=\"calcTbl\"><\/table><\/div>\n    <div class=\"note\" id=\"calcNote\"><\/div>\n  <\/section>\n\n  <section class=\"panel\">\n    <div class=\"phead\">\n      <div><h2>แนวโน้มรายเดือน<\/h2><p>อ้างอิงจากคอลัมน์ Month · คลิกเดือนเพื่อเลือก/ยกเลิกในตัวกรอง<\/p><\/div>\n      <div class=\"legend\"><span><i style=\"background:var(--accent)\"><\/i>CSI<\/span><span><i style=\"background:var(--s2)\"><\/i>NPS<\/span><\/div>\n    <\/div>\n    <div class=\"chartbox\"><div class=\"vchart mchart\" id=\"monthChart\"><\/div><\/div>\n    <div class=\"tblwrap\"><table class=\"heat\" id=\"heatTbl\"><\/table><\/div>\n    <div class=\"legend\"><span><i style=\"background:var(--good-bg);outline:1px solid var(--good)\"><\/i>≥ 90%<\/span><span><i style=\"background:var(--warn-bg);outline:1px solid var(--warn)\"><\/i>75–89.9%<\/span><span><i style=\"background:var(--bad-bg);outline:1px solid var(--bad)\"><\/i>&lt; 75%<\/span><\/div>\n  <\/section>\n\n  <section class=\"panel\">\n    <div class=\"phead\">\n      <div><h2>รายละเอียดทุกเคส<\/h2><p>คลิกเลข SP เพื่อดูผลประเมินของงานซ่อมนั้น · เรียงจากคะแนนต่ำสุดก่อน<\/p><\/div>\n      <div class=\"toggles\">\n        <label><input type=\"checkbox\" id=\"onlySel\"> เฉพาะเคสที่มีคะแนนตามที่เลือก<\/label>\n        <label><input type=\"checkbox\" id=\"onlyCmt\"> เฉพาะเคสที่มีความเห็น<\/label>\n      <\/div>\n    <\/div>\n    <div class=\"casecount\" id=\"caseCount\"><\/div>\n    <div class=\"tblwrap\" style=\"max-height:640px;overflow:auto\"><table class=\"cases\" id=\"caseTbl\"><\/table><\/div>\n  <\/section>\n<\/div>\n\n<div id=\"modalRoot\"><\/div>\n<div id=\"reportRoot\" hidden><\/div>\n<div class=\"dropzone\" id=\"dropzone\" hidden><div>วางไฟล์ Excel ที่นี่<br><span class=\"muted\" style=\"font-size:14px;font-weight:500\">CSI Weekly result (.xlsx)<\/span><\/div><\/div>\n<div class=\"toast\" id=\"toast\" hidden><\/div>\n\n<script>\nconst SAMPLE = {\"dealer\": \"Draft\", \"reportDate\": \"\", \"fileName\": \"\", \"draft\": true, \"qText\": [\"Q1. ความสะดวกในการนัดหมายนำรถเข้ารับบริการ\", \"Q2.ความรู้ความสามารถของที่ปรึกษางานบริการในการสรุปงานบริการตามที่ลูกค้าแจ้งซ่อมอย่างครบถ้วน\", \"Q3. งานเช็กระยะหรืองานซ่อมตามที่ท่านแจ้งได้รับการแก้ไขเรียบร้อยภายในครั้งแรก\", \"Q4. ความพึงพอใจต่อการส่งมอบรถคืนตรงตามเวลาที่กำหนด\", \"Q5. ความพึงพอใจต่อความสะอาดของรถยนต์หลังจากรับรถคืนเพียงใด\", \"Q6. ความคุ้มค่าของค่าซ่อมต่องานบริการที่ได้รับ\", \"Q7. ท่านพึงพอใจกับทัศนคติและการให้บริการของพนักงานที่เกี่ยวข้องเพียงใด\", \"Q8. ความพึงพอใจโดยรวมในการนำรถเข้ารับบริการครั้งนี้\", \"Q9. ท่านจะแนะนำศูนย์บริการแห่งนี้ให้กับคนรู้จักของท่านในระดับใด\"], \"rows\": []};\nconst SHORT = ['นัดหมาย','SA สรุปงานครบ','ซ่อมเสร็จครั้งแรก','ส่งมอบตรงเวลา','ความสะอาดรถ','ความคุ้มค่า','ทัศนคติพนักงาน','พอใจโดยรวม','แนะนำต่อ (NPS)'];\nconst MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];\nconst SC_COLOR = s => `var(--s${s})`;\nconst $ = id => document.getElementById(id);\nconst esc = s => String(s ?? '').replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst fmt = v => v == null ? '–' : (Math.round(v*10)/10).toFixed(1) + '%';\nconst band = v => v == null ? '' : v >= 90 ? 'good' : v >= 75 ? 'warn' : 'bad';\nconst monLabel = k => { const [y,m] = k.split('-'); return `${MON[+m-1]} ${y.slice(2)}`; };\n\nconst state = { data: SAMPLE, months: new Set(), scores: new Set([1,2,3]), q: '', metric: 'count', sort: 'desc', onlySel: false, onlyCmt: false };\ntry { const s = JSON.parse(localStorage.getItem('csi-prefs') || '{}'); if (s.scores) state.scores = new Set(s.scores); if (s.metric) state.metric = s.metric; if (s.sort) state.sort = s.sort; } catch (e) {}\nfunction savePrefs(){ try { localStorage.setItem('csi-prefs', JSON.stringify({scores:[...state.scores], metric:state.metric, sort:state.sort})); } catch (e) {} }\n\n/* ---------- calculation ---------- */\nfunction calcQ(rows, qi){\n  let H=0,N3=0,U=0,N=0;\n  for (const r of rows){ const s = r.s[qi]; if (s==null) continue; N++; if (s>=4) H++; else if (s===3) N3++; else U++; }\n  return { H, N3, U, N, score: N ? (H-U)/N*100 : null };\n}\nfunction calcAll(rows){\n  const qs = [...Array(9)].map((_,i)=>calcQ(rows,i));\n  const csiQs = qs.slice(0,8).filter(q=>q.score!=null);\n  const sum = csiQs.reduce((a,q)=>a+q.score,0);\n  return { qs, csiSum: sum, csiCount: csiQs.length, csi: csiQs.length ? sum/csiQs.length : null, nps: qs[8].score };\n}\n\n/* ---------- filtering ---------- */\nconst norm = s => String(s||'').toUpperCase().replace(/[\\s\\-]/g,'');\nfunction baseRows(ignoreMonth){\n  const q = norm(state.q);\n  return state.data.rows.filter(r => (ignoreMonth || !state.months.size || state.months.has(r.m)) &&\n    (!q || norm(r.sp).includes(q) || norm(r.vin).includes(q)));\n}\nconst hasSel = r => r.s.some(s => s!=null && state.scores.has(s));\nconst hasCmt = r => r.c.some(Boolean) || !!r.o;\n\n/* ---------- render ---------- */\nfunction renderAll(){ renderHeader(); renderFilters(); const rows = baseRows(false); renderKPIs(rows); renderRank(rows); renderCalc(rows); renderMonthly(); renderCases(rows); }\n\nfunction renderHeader(){\n  const d = state.data;\n  $('dealer').textContent = d.dealer || 'CSI Score Analysis';\n  const rd = d.reportDate ? ` · Report date ${d.reportDate}` : '';\n  $('dropcard').hidden = !d.draft;\n  $('reportBtn').disabled = !!d.draft || !d.rows.length;\n  $('filemeta').innerHTML = d.draft ? 'ยังไม่มีข้อมูล · นำเข้าไฟล์เพื่อแสดงชื่อ Partner<span class=\"tag\">Draft<\/span>' : `${esc(d.fileName)}${esc(rd)} · ${d.rows.length} แบบสำรวจ`;\n}\n\nfunction renderFilters(){\n  const months = [...new Set(state.data.rows.map(r=>r.m))].sort();\n  const mc = $('monthChips');\n  mc.innerHTML = `<button class=\"chip\" data-m=\"\" aria-pressed=\"${!state.months.size}\">ทั้งหมด<\/button>` +\n    months.map(m=>`<button class=\"chip\" data-m=\"${m}\" aria-pressed=\"${state.months.has(m)}\">${monLabel(m)}<\/button>`).join('');\n  $('scoreChips').innerHTML = [1,2,3,4,5].map(s=>`<button class=\"chip sc\" data-s=\"${s}\" aria-pressed=\"${state.scores.has(s)}\"><span class=\"dot\" style=\"background:${SC_COLOR(s)}\"><\/span>${s}<\/button>`).join('');\n  const parts = [];\n  if (state.months.size) parts.push(`${state.months.size} เดือน`);\n  if (state.q) parts.push(`ค้นหา “${esc(state.q)}”`);\n  $('filterInfo').innerHTML = parts.length ? `กรองอยู่: ${parts.join(' · ')} <button class=\"linkbtn\" id=\"clearAll\">ล้างตัวกรอง<\/button>` : '';\n  for (const b of document.querySelectorAll('#metricSeg button')) b.setAttribute('aria-pressed', b.dataset.v===state.metric);\n  for (const b of document.querySelectorAll('#sortSeg button')) b.setAttribute('aria-pressed', b.dataset.v===state.sort);\n  $('onlySel').checked = state.onlySel; $('onlyCmt').checked = state.onlyCmt;\n}\n\nfunction renderKPIs(rows){\n  const a = calcAll(rows);\n  const sel = rows.filter(hasSel).length;\n  const selTxt = [...state.scores].sort().join(', ') || '–';\n  const H9 = a.qs[8];\n  $('kpis').innerHTML = `\n    <div class=\"kpi hero\"><span class=\"lbl\">CSI โดยรวม (Q1–Q8)<\/span><span class=\"val\">${fmt(a.csi)}<\/span><span class=\"sub\">${a.csiSum.toFixed(1)} ÷ ${a.csiCount}<\/span><\/div>\n    <div class=\"kpi hero\"><span class=\"lbl\">NPS (Q9)<\/span><span class=\"val\">${fmt(a.nps)}<\/span><span class=\"sub\">(${H9.H} − ${H9.U}) ÷ ${H9.N} × 100<\/span><\/div>\n    <div class=\"kpi\"><span class=\"lbl\">จำนวนแบบสำรวจ<\/span><span class=\"val\">${rows.length}<\/span><span class=\"sub\">${state.months.size ? state.months.size+' เดือนที่เลือก' : 'ทุกเดือน'}<\/span><\/div>\n    <div class=\"kpi\"><span class=\"lbl\">เคสที่มีคะแนน ${selTxt}<\/span><span class=\"val\">${sel}<\/span><span class=\"sub\">${rows.length ? (sel/rows.length*100).toFixed(1) : 0}% ของแบบสำรวจ · อย่างน้อย 1 ข้อ<\/span><\/div>`;\n}\n\nfunction renderRank(rows){\n  const a = calcAll(rows);\n  const scores = [...state.scores].sort();\n  let items = a.qs.map((q,i)=>{\n    const by = {}; for (const s of scores) by[s] = rows.filter(r=>r.s[i]===s).length;\n    const count = scores.reduce((t,s)=>t+by[s],0);\n    return { i, by, count, score: q.score, n: q.N };\n  });\n  const val = it => state.metric==='count' ? it.count : (it.score ?? 0);\n  if (state.sort==='q') items.sort((x,y)=>x.i-y.i);\n  else if (state.metric==='count') items.sort((x,y)=> state.sort==='desc' ? (y.count-x.count)||(x.i-y.i) : (x.count-y.count)||(x.i-y.i));\n  else items.sort((x,y)=> state.sort==='desc' ? ((x.score??999)-(y.score??999))||(x.i-y.i) : ((y.score??-999)-(x.score??-999))||(x.i-y.i)); // desc = most problem first = lowest score\n\n  let max, min = 0, ticks;\n  if (state.metric==='count'){ max = Math.max(1, ...items.map(it=>it.count)); const step = niceStep(max/4); max = Math.ceil(max/step)*step; ticks = range(0,max,step); }\n  else { const lo = Math.min(0, ...items.map(it=>it.score??0)); min = lo<0 ? Math.floor(lo/20)*20 : 0; max = 100; ticks = range(min,100,20); }\n  const y = v => (v-min)/(max-min)*100;\n\n  const grid = ticks.map(t=>`<div class=\"grid\" style=\"bottom:${y(t)}%\"><span>${t}${state.metric==='score'?'':''}<\/span><\/div>`).join('');\n  const bars = items.map(it=>{\n    let inner;\n    if (state.metric==='count'){\n      const segs = scores.map(s=> it.by[s] ? `<i style=\"height:${it.by[s]/it.count*100}%;background:${SC_COLOR(s)}\" title=\"คะแนน ${s}: ${it.by[s]} เคส\"><\/i>` : '').join('');\n      inner = `<div class=\"stack\" style=\"bottom:0;height:${y(it.count)}%\">${segs}<\/div><div class=\"barval\" style=\"bottom:calc(${y(it.count)}% + 2px)\">${it.count}<\/div>`;\n    } else {\n      const v = it.score ?? 0, z = y(0), top = y(Math.max(v,0)), bot = y(Math.min(v,0));\n      inner = `<div class=\"stack\" style=\"bottom:${bot}%;height:${top-bot}%;background:var(--${band(it.score)||'line'})\"><\/div><div class=\"barval\" style=\"bottom:calc(${top}% + 2px)\">${it.score==null?'–':it.score.toFixed(1)}<\/div>`;\n    }\n    return `<div class=\"barcol\" data-q=\"${it.i}\" role=\"button\" tabindex=\"0\" aria-label=\"Q${it.i+1} ${SHORT[it.i]}\">${inner}<\/div>`;\n  }).join('');\n  const zeroLine = min<0 ? `<div class=\"zero\" style=\"bottom:${y(0)}%\"><\/div>` : '';\n  const xl = items.map(it=>`<div><b>Q${it.i+1}<\/b>${SHORT[it.i]}<\/div>`).join('');\n  $('rankChart').innerHTML = `<div class=\"plot\">${grid}${zeroLine}<div class=\"bars\">${bars}<\/div><\/div><div class=\"xlabels\">${xl}<\/div>`;\n\n  $('rankSub').textContent = state.metric==='count'\n    ? `จำนวนคำตอบที่ได้คะแนน ${scores.join(', ')||'–'} ในแต่ละข้อ · คลิกแท่งกราฟเพื่อดูเคส`\n    : `คะแนน (Happy − Unhappy) ÷ N × 100 ของแต่ละข้อ · \"มาก → น้อย\" = ปัญหามากสุด (คะแนนต่ำสุด) ก่อน · คลิกแท่งเพื่อดูเคส`;\n  $('rankLegend').innerHTML = state.metric==='count'\n    ? scores.map(s=>`<span><i style=\"background:${SC_COLOR(s)}\"><\/i>คะแนน ${s}<\/span>`).join('')\n    : `<span><i style=\"background:var(--good)\"><\/i>≥ 90%<\/span><span><i style=\"background:var(--warn)\"><\/i>75–89.9%<\/span><span><i style=\"background:var(--bad)\"><\/i>&lt; 75%<\/span>`;\n  const worst = [...items].filter(it=>state.metric==='count'?it.count>0:true).sort((x,y)=>state.metric==='count' ? y.count-x.count : (x.score??999)-(y.score??999)).slice(0,3);\n  $('rankLine').innerHTML = worst.length && rows.length\n    ? `<b>ข้อที่ต้องโฟกัส:<\/b> ` + worst.map((it,k)=>`${k+1}. Q${it.i+1} ${SHORT[it.i]} — ${state.metric==='count' ? it.count+' เคส' : fmt(it.score)}`).join(' &nbsp;·&nbsp; ')\n    : 'ไม่มีเคสที่ได้คะแนนตามที่เลือกในช่วงนี้';\n}\nfunction niceStep(x){ const p = Math.pow(10, Math.floor(Math.log10(Math.max(x,1)))); const f = x/p; return (f<=1?1:f<=2?2:f<=5?5:10)*p; }\nfunction range(a,b,s){ const o=[]; for(let v=a; v<=b+1e-9; v+=s) o.push(Math.round(v*100)/100); return o; }\n\nfunction renderCalc(rows){\n  const a = calcAll(rows);\n  const tr = (q,i) => `<tr><td><b>Q${i+1}<\/b><\/td><td style=\"min-width:200px\">${esc(stripQ(state.data.qText[i]))}<\/td>\n    <td class=\"r num\" style=\"color:var(--good)\">${q.H}<\/td><td class=\"r num\" style=\"color:var(--warn)\">${q.N3}<\/td><td class=\"r num\" style=\"color:var(--bad)\">${q.U}<\/td><td class=\"r num\">${q.N}<\/td>\n    <td class=\"calc\">(${q.H} − ${q.U}) ÷ ${q.N} × 100<\/td><td class=\"r\"><span class=\"pill ${band(q.score)}\">${fmt(q.score)}<\/span><\/td><\/tr>`;\n  $('calcTbl').innerHTML = `<thead><tr><th>ข้อ<\/th><th>หัวข้อ<\/th><th class=\"r\">Happy (4–5)<\/th><th class=\"r\">Neutral (3)<\/th><th class=\"r\">Unhappy (1–2)<\/th><th class=\"r\">N<\/th><th>การคำนวณ<\/th><th class=\"r\">คะแนน<\/th><\/tr><\/thead>\n    <tbody>${a.qs.slice(0,8).map(tr).join('')}\n    <tr class=\"total\"><td colspan=\"6\">CSI โดยรวม = ผลรวม CSI ข้อ 1–8 ÷ 8<\/td><td class=\"calc\">${a.qs.slice(0,8).map(q=>q.score==null?'–':q.score.toFixed(1)).join(' + ')} = ${a.csiSum.toFixed(1)} ÷ ${a.csiCount}<\/td><td class=\"r\"><span class=\"pill ${band(a.csi)}\">${fmt(a.csi)}<\/span><\/td><\/tr>\n    ${tr(a.qs[8],8).replace('<tr>','<tr class=\"total\">').replace('<b>Q9<\/b>','<b>NPS Q9<\/b>')}<\/tbody>`;\n  $('calcNote').textContent = `คะแนนที่ว่างหรือ 0 ไม่นับเป็นผู้ถูกสำรวจของข้อนั้น · ตัวหารของ CSI โดยรวมคือจำนวนข้อที่มีผู้ตอบ (ปกติ = 8) · ใช้ตามเกณฑ์ CSI 2026 มีผลตั้งแต่ 1 ม.ค. 2569`;\n}\nconst stripQ = t => String(t||'').replace(/^Q\\d\\.?\\s*/,'');\n\nfunction renderMonthly(){\n  const rows = baseRows(true);\n  const months = [...new Set(state.data.rows.map(r=>r.m))].sort();\n  const data = months.map(m=>{ const rs = rows.filter(r=>r.m===m); return { m, n: rs.length, ...calcAll(rs) }; });\n  const vals = data.flatMap(d=>[d.csi,d.nps]).filter(v=>v!=null);\n  const lo = Math.min(0,...vals); const min = lo<0 ? Math.floor(lo/20)*20 : 0, max = 100;\n  const y = v => (v-min)/(max-min)*100;\n  const bar = (v,color) => { if (v==null) return `<div class=\"mbar\"><\/div>`; const t=y(Math.max(v,0)), b=y(Math.min(v,0));\n    return `<div class=\"mbar\"><div class=\"stack\" style=\"bottom:${b}%;height:${t-b}%;background:${color}\"><\/div><div class=\"barval\" style=\"bottom:calc(${t}% + 2px);font-size:11px\">${v.toFixed(1)}<\/div><\/div>`; };\n  const grid = range(min,100,20).map(t=>`<div class=\"grid\" style=\"bottom:${y(t)}%\"><span>${t}<\/span><\/div>`).join('');\n  const groups = data.map(d=>`<div class=\"mgroup ${state.months.size && !state.months.has(d.m) ? 'dim':''}\" data-m=\"${d.m}\" role=\"button\" tabindex=\"0\" title=\"${monLabel(d.m)} · ${d.n} แบบสำรวจ\">${bar(d.csi,'var(--accent)')}${bar(d.nps,'var(--s2)')}<\/div>`).join('');\n  $('monthChart').style.minWidth = Math.max(520, months.length*70) + 'px';\n  $('monthChart').innerHTML = `<div class=\"plot\">${grid}${min<0?`<div class=\"zero\" style=\"bottom:${y(0)}%\"><\/div>`:''}<div class=\"bars\">${groups}<\/div><\/div>\n    <div class=\"xlabels\" style=\"gap:4px\">${data.map(d=>`<div><b>${monLabel(d.m)}<\/b>n=${d.n}<\/div>`).join('')}<\/div>`;\n  const cell = v => `<td class=\"h\"><span class=\"pill ${band(v)}\">${v==null?'–':v.toFixed(1)}<\/span><\/td>`;\n  $('heatTbl').innerHTML = `<thead><tr><th>เดือน<\/th><th class=\"r\">N<\/th>${SHORT.map((s,i)=>`<th class=\"c\" title=\"${esc(state.data.qText[i])}\">Q${i+1}<\/th>`).join('')}<th class=\"c\">CSI<\/th><th class=\"c\">NPS<\/th><\/tr><\/thead>\n    <tbody>${data.map(d=>`<tr class=\"${state.months.has(d.m)?'sel':''}\"><td><button class=\"linkbtn\" data-m=\"${d.m}\">${monLabel(d.m)}<\/button><\/td><td class=\"r num\">${d.n}<\/td>${d.qs.map(q=>cell(q.score)).join('')}${cell(d.csi)}${cell(d.nps)}<\/tr>`).join('')}<\/tbody>`;\n}\n\nconst chip = s => s==null ? `<span class=\"sc-chip na\">–<\/span>` : `<span class=\"sc-chip s${s}\" style=\"background:${SC_COLOR(s)}\">${s}<\/span>`;\nfunction caseSort(a,b){ const ma = Math.min(...a.s.map(s=>s??9)), mb = Math.min(...b.s.map(s=>s??9)); return ma-mb || (b.ad||'').localeCompare(a.ad||''); }\nfunction renderCases(rows){\n  let list = rows.filter(r => (!state.onlySel || hasSel(r)) && (!state.onlyCmt || hasCmt(r))).sort(caseSort);\n  $('caseCount').textContent = `${list.length} เคส จาก ${rows.length} แบบสำรวจในตัวกรองปัจจุบัน`;\n  if (!list.length){ $('caseTbl').innerHTML = `<tbody><tr><td class=\"empty\">ไม่พบเคสตามตัวกรอง<\/td><\/tr><\/tbody>`; return; }\n  $('caseTbl').innerHTML = `<thead><tr><th>เดือน / สัปดาห์<\/th><th>วันที่รับรถ<\/th><th>SP (Repair Order)<\/th><th>VIN<\/th><th>ประเภทลูกค้า<\/th>${SHORT.map((s,i)=>`<th class=\"c\" title=\"${esc(state.data.qText[i])}\">Q${i+1}<\/th>`).join('')}<th>ความเห็นลูกค้า<\/th><\/tr><\/thead>\n    <tbody>${list.map(r=>`<tr>\n      <td>${monLabel(r.m)}<div class=\"muted\" style=\"font-size:12px\">${esc(r.w)}<\/div><\/td><td class=\"num\">${esc(r.ad)}<\/td>\n      <td><button class=\"splink\" data-sp=\"${esc(r.sp)}\">${esc(r.sp)}<\/button><\/td><td class=\"mono\">${esc(r.vin)}<\/td><td>${esc(r.ct)}<\/td>\n      ${r.s.map(s=>`<td class=\"c\">${chip(s)}<\/td>`).join('')}\n      <td class=\"cmt\">${commentsHtml(r) || '<span class=\"muted\">–<\/span>'}<\/td><\/tr>`).join('')}<\/tbody>`;\n}\nfunction commentsHtml(r){\n  return r.c.map((c,i)=> c ? `<div><b>Q${i+1}<\/b>${esc(c)}<\/div>` : '').join('') + (r.o ? `<div><b>อื่นๆ<\/b>${esc(r.o)}<\/div>` : '');\n}\n\n/* ---------- modals ---------- */\nlet lastFocus = null;\nfunction openModal(title, sub, body){\n  lastFocus = document.activeElement;\n  $('modalRoot').innerHTML = `<div class=\"overlay\" id=\"ov\"><div class=\"modal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"mt\">\n    <div class=\"mhead\"><div><h3 id=\"mt\">${title}<\/h3><div class=\"muted\" style=\"font-size:13px\">${sub}<\/div><\/div><button class=\"xbtn\" id=\"mx\" aria-label=\"ปิด\">×<\/button><\/div>\n    <div class=\"mbody\">${body}<\/div><\/div><\/div>`;\n  $('mx').focus();\n}\nfunction closeModal(){ $('modalRoot').innerHTML=''; lastFocus?.focus?.(); }\n\nfunction showQuestion(qi){\n  const rows = baseRows(false);\n  const scores = [...state.scores];\n  const list = rows.filter(r=>r.s[qi]!=null && state.scores.has(r.s[qi])).sort((a,b)=>a.s[qi]-b.s[qi] || (b.ad||'').localeCompare(a.ad||''));\n  const q = calcQ(rows,qi);\n  const body = !list.length ? `<div class=\"empty\">ไม่มีเคสที่ได้คะแนน ${scores.sort().join(', ')} ในข้อนี้<\/div>` :\n    `<div class=\"tblwrap\"><table class=\"cases\"><thead><tr><th class=\"c\">คะแนน<\/th><th>SP<\/th><th>VIN<\/th><th>เดือน<\/th><th>ประเภทลูกค้า<\/th><th>เหตุผล / ความเห็น<\/th><\/tr><\/thead><tbody>\n    ${list.map(r=>`<tr><td class=\"c\">${chip(r.s[qi])}<\/td><td><button class=\"splink\" data-sp=\"${esc(r.sp)}\">${esc(r.sp)}<\/button><\/td><td class=\"mono\">${esc(r.vin)}<\/td><td>${monLabel(r.m)}<\/td><td>${esc(r.ct)}<\/td>\n      <td class=\"cmt\">${r.c[qi] ? esc(r.c[qi]) : ''}${r.o ? `<div class=\"muted\"><b>อื่นๆ<\/b>${esc(r.o)}<\/div>` : ''}${!r.c[qi] && !r.o ? '<span class=\"muted\">–<\/span>' : ''}<\/td><\/tr>`).join('')}\n    <\/tbody><\/table><\/div>`;\n  openModal(`Q${qi+1} · ${esc(SHORT[qi])}`,\n    `${esc(stripQ(state.data.qText[qi]))}<br>${list.length} เคสที่ได้คะแนน ${scores.sort().join(', ')} · คะแนนข้อนี้ ${fmt(q.score)} = (${q.H} − ${q.U}) ÷ ${q.N} × 100`, body);\n}\n\nfunction showSP(sp){\n  const recs = state.data.rows.filter(r=>r.sp===sp);\n  if (!recs.length) return;\n  const r = recs[0];\n  const a = calcAll([r]);\n  const meta = [['VIN',`<span class=\"mono\">${esc(r.vin)}<\/span>`],['เดือน / สัปดาห์',`${monLabel(r.m)} · ${esc(r.w)}`],['วันที่รับรถ / ส่งมอบ',`${esc(r.ad)} → ${esc(r.dd)}`],\n    ['ประเภทลูกค้า',esc(r.ct)],['หมวดงานซ่อม',esc(r.rc)],['ประเภทงานซ่อม',esc(r.rt)]];\n  if (r.nm) meta.unshift(['ลูกค้า',esc(r.nm)]);\n  const qitems = r.s.map((s,i)=>`<div class=\"qitem\">${chip(s)}<div><b>Q${i+1}<\/b> ${esc(stripQ(state.data.qText[i]))}<\/div>${r.c[i]?`<div class=\"qc\">“${esc(r.c[i])}”<\/div>`:''}<\/div>`).join('');\n  const others = state.data.rows.filter(x=>x.vin===r.vin && x.sp!==sp);\n  const hist = others.length ? `<div><b>ประวัติแบบสำรวจอื่นของ VIN นี้<\/b><div class=\"frow\" style=\"margin-top:6px\">${others.map(o=>`<button class=\"splink\" data-sp=\"${esc(o.sp)}\">${esc(o.sp)}<\/button><span class=\"muted\">(${monLabel(o.m)}, ต่ำสุด ${Math.min(...o.s.map(s=>s??9))})<\/span>`).join(' ')}<\/div><\/div>` : '';\n  openModal(`<span class=\"mono\" style=\"font-size:16px\">${esc(sp)}<\/span>`,\n    `CSI ของเคสนี้ ${fmt(a.csi)} · NPS ${fmt(a.nps)}`,\n    `<div class=\"meta\">${meta.map(([k,v])=>`<div><span>${k}<\/span>${v||'–'}<\/div>`).join('')}<\/div>\n     <div class=\"qlist\">${qitems}<\/div>${r.o?`<div class=\"other\"><b>ข้อเสนอแนะอื่นๆ:<\/b> ${esc(r.o)}<\/div>`:''}${hist}`);\n}\n\n/* ---------- Excel parsing ---------- */\nfunction parseWorkbook(wb, fileName){\n  let best = null;\n  for (const name of wb.SheetNames){\n    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, raw:true, defval:null});\n    for (let h=0; h<Math.min(aoa.length,25); h++){\n      const hdr = (aoa[h]||[]).map(v=>String(v??'').trim());\n      const qCols = mapQ(hdr);\n      const vin = hdr.findIndex(t=>/vin/i.test(t));\n      if (qCols.filter(x=>x>=0).length >= 8 && vin>=0){\n        const hasMonth = hdr.some(t=>/^month$/i.test(t));\n        const cand = { name, aoa, h, hdr, qCols, score: (hasMonth?1e7:0) + (aoa.length-h) };\n        if (!best || cand.score > best.score) best = cand;\n        break;\n      }\n    }\n  }\n  if (!best) throw new Error('ไม่พบหัวคอลัมน์ Q1–Q9 และ VIN ในไฟล์นี้ ตรวจสอบว่าเป็นไฟล์ CSI Weekly result');\n  const {aoa, h, hdr, qCols} = best;\n  const col = re => hdr.findIndex(t=>re.test(t));\n  const C = { m: col(/^month$/i), w: col(/^week$/i), ad: col(/^arrival( time| date)?$/i), dd: col(/^delivery( time| date)?$/i), sp: col(/repair order/i),\n    vin: col(/vin/i), nm: col(/car owner/i), ct: col(/customer type/i), rc: col(/repair category/i), rt: col(/^repair type$/i), st: col(/store name/i),\n    o: col(/ข้อเสนอแนะ|other comment/i) };\n  if (C.nm<0) C.nm = col(/^sender$/i);\n  const cCols = [...Array(9)].map((_,i)=> hdr.findIndex(t=> new RegExp(`ถามเมื่อ\\\\s*Q${i+1}\\\\b|^Q${i+1}\\\\s*comment`,'i').test(t)));\n  const rows = [];\n  for (let r=h+1; r<aoa.length; r++){\n    const row = aoa[r]; if (!row) continue;\n    const sp = clean(row[C.sp]), vin = clean(row[C.vin]);\n    if (!sp && !vin) continue;\n    const s = qCols.map(ci=>{ const v = ci<0 ? null : Number(row[ci]); return Number.isFinite(v) && v>=1 && v<=5 ? Math.round(v) : null; });\n    if (s.every(v=>v==null)) continue;\n    const ad = toDate(row[C.ad]);\n    let m = C.m>=0 ? toDate(row[C.m]) : null;\n    m = (m || ad || '').slice(0,7) || 'unknown';\n    rows.push({ m, w: clean(row[C.w]).replace(/\\s+/g,' '), ad: ad||'', dd: toDate(row[C.dd])||'', sp, vin, nm: clean(row[C.nm]), ct: clean(row[C.ct]), rc: clean(row[C.rc]), rt: clean(row[C.rt]),\n      st: clean(row[C.st]), s, c: cCols.map(ci=>ci<0?'':clean(row[ci])), o: clean(row[C.o]) });\n  }\n  if (!rows.length) throw new Error('พบหัวตารางแต่ไม่มีแถวข้อมูลคะแนน');\n  // dealer & report date from header area\n  let reportDate = '', dealer = rows.find(r=>r.st)?.st || '';\n  for (let r=0; r<h; r++){ const row = aoa[r]||[]; for (let c=0;c<row.length;c++){ const t = String(row[c]??'');\n    if (/report date/i.test(t)) reportDate = toDate(row[c+1]) || reportDate;\n    if (/survey summary of/i.test(t) && row[c+1]==null && row[c+2]) dealer = clean(row[c+2]) || dealer; } }\n  const qText = qCols.map((ci,i)=> ci<0 ? `Q${i+1}` : hdr[ci].replace(/ /g,' ').trim());\n  return { dealer, reportDate, fileName, sample:false, qText, rows };\n}\nfunction mapQ(hdr){\n  return [...Array(9)].map((_,i)=> hdr.findIndex(t=> new RegExp(`^Q${i+1}(?![0-9])`,'i').test(t) && !/comment|เหตุใด|ถามเมื่อ/i.test(t)));\n}\nfunction clean(v){ if (v==null) return ''; const s = String(v).replace(/​/g,'').trim(); return (s==='0'||s==='-') ? '' : s; }\nfunction toDate(v){\n  if (v==null || v==='') return null;\n  if (v instanceof Date && !isNaN(v)) return `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}-${String(v.getDate()).padStart(2,'0')}`;\n  if (typeof v==='number' && v>20000 && v<80000){ const d = XLSX.SSF.parse_date_code(Math.round(v)); return `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`; }\n  const s = String(v).trim(); let m;\n  if ((m = s.match(/^(\\d{4})-(\\d{1,2})(?:-(\\d{1,2}))?/))) return `${m[1]}-${m[2].padStart(2,'0')}-${(m[3]||'1').padStart(2,'0')}`;\n  if ((m = s.match(/^(\\d{1,2})\\/(\\d{1,2})\\/(\\d{4})/))) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;\n  const d = new Date(s); return isNaN(d) ? null : toDate(d);\n}\n\nasync function loadFiles(files){\n  files = [...files].filter(f=>/\\.(xlsx|xlsm|xls|csv)$/i.test(f.name));\n  if (!files.length) return toast('กรุณาเลือกไฟล์ .xlsx');\n  if (typeof XLSX==='undefined') return toast('โหลดตัวอ่าน Excel ไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วรีเฟรชหน้า');\n  try {\n    const parsed = [];\n    for (const f of files){ const wb = XLSX.read(await f.arrayBuffer(), {type:'array'}); parsed.push(parseWorkbook(wb, f.name)); }\n    let data = parsed[0];\n    if (parsed.length>1){\n      const seen = new Set(), rows = [];\n      for (const p of parsed) for (const r of p.rows){ const k = r.sp+'|'+r.vin; if (!seen.has(k)){ seen.add(k); rows.push(r);} }\n      const dealers = [...new Set(parsed.map(p=>p.dealer).filter(Boolean))];\n      data = { ...parsed[0], rows, dealer: dealers.length===1 ? dealers[0] : `${dealers.length} ดีลเลอร์`, fileName: `${parsed.length} ไฟล์`, reportDate: parsed.map(p=>p.reportDate).sort().pop() };\n    }\n    state.data = data; state.months.clear(); state.q=''; $('q').value='';\n    renderAll(); toast(`นำเข้า ${data.rows.length} แบบสำรวจจาก ${data.fileName}`);\n  } catch (e){ console.error(e); toast(e.message || 'อ่านไฟล์ไม่สำเร็จ'); }\n}\n\nlet toastT;\nfunction toast(msg){ const t=$('toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,3800); }\n\n/* ---------- events ---------- */\n$('pick').onclick = () => $('file').click();\n$('dropcard').onclick = () => $('file').click();\n$('file').onchange = e => { loadFiles(e.target.files); e.target.value=''; };\nlet dragDepth = 0;\naddEventListener('dragenter', e=>{ if ([...(e.dataTransfer?.types||[])].includes('File ist.filter(r=>r.c[q.i]||r.o);\n      return `<div class=\"focus-item\"><h4><span>${k+1}. Q${q.i+1} ${esc(SHORT[q.i])}<\/span><span class=\"muted\" style=\"font-family:var(--f-body);font-weight:500;font-size:11.5px\">${q.sel} เคส · คะแนนข้อ ${fmt(q.score)}<\/span><\/h4>\n        <ul>${withC.length ? withC.slice(0,8).map(r=>`<li>${rsc(r.s[q.i])} ${esc(r.c[q.i] || r.o)} <span class=\"muted mono\">${esc(r.sp)}<\/span><\/li>`).join('') : '<li class=\"muted\">ลูกค้าไม่ได้ให้เหตุผล<\/li>'}\n        ${withC.length>8 ? `<li class=\"muted\">และอีก ${withC.length-8} ความเห็น<\/li>`:''}<\/ul><\/div>`; }).join('')}<\/div>`;\n\n  if (rstate.cases){\n    h += `<div class=\"rb\">${H(`รายการเคสที่ได้คะแนน ${scores.join(', ')||'–'} (${selCases.length} เคส)`)}${!selCases.length ? '<div class=\"muted\">ไม่มีเคส<\/div>' :\n      `<table><thead><tr><th>เดือน<\/th><th>SP / VIN<\/th><th>ประเภทลูกค้า<\/th><th>ข้อที่ได้คะแนนตามที่เลือก<\/th><th>ความเห็นลูกค้า<\/th><\/tr><\/thead><tbody>\n      ${selCases.map(r=>`<tr><td style=\"white-space:nowrap\">${monLabel(r.m)}<div class=\"muted\">${esc(r.ad)}<\/div><\/td><td><span class=\"mono\">${esc(r.sp)}<\/span><div class=\"mono muted\">${esc(r.vin)}<\/div><\/td><td>${esc(r.ct)}<\/td><td style=\"line-height:1.9\">${lowQs(r)}<\/td><td>${cmts(r)}<\/td><\/tr>`).join('')}\n      <\/tbody><\/table>`}<\/div>`;\n  }\n  if (rstate.plan){\n    const items = focus.length ? focus.map(q=>`Q${q.i+1} ${esc(SHORT[q.i])}`) : [];\n    while (items.length < 3) items.push('');\n    h += `<div class=\"rb\">${H('แผนการแก้ไข (Action Plan)')}<table class=\"r-blank\"><thead><tr><th style=\"width:22%\">ประเด็น<\/th><th style=\"width:22%\">สาเหตุ<\/th><th>แนวทางแก้ไข<\/th><th style=\"width:14%\">ผู้รับผิดชอบ<\/th><th style=\"width:12%\">กำหนดเสร็จ<\/th><\/tr><\/thead>\n      <tbody>${items.map(t=>`<tr><td>${t}<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr>`).join('')}<\/tbody><\/table><\/div>`;\n  }\n  if (rstate.note.trim()) h += `<div class=\"rb\">${H('ความเห็นเพิ่มเต 'reportRoot').innerHTML = ''; document.body.style.overflow = ''; $('reportBtn').focus(); }\n\nconst fileBase = () => `CSI_Report_${(state.data.dealer||'Partner').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_|_$/g,'') || 'Partner'}_${periodInfo().key}`;\nfunction busy(on, msg){ let b = document.getElementById('rBusy'); if (!on){ b?.remove(); return; } if (!b){ b = document.createElement('div'); b.id='rBusy'; b.className='rbusy'; document.body.append(b); } b.innerHTML = `<div>${msg}<\/div>`; }\n\nlet dlP = null;\nfunction getDownloads(){ if (!window.claude?.use) return Promise.resolve(null); return dlP ||= window.claude.use('downloads').catch(()=>null); }\nasync function saveFile(filename, data, mime){\n  if (window.claude?.use){\n    const dl = await getDownloads();\n    if (!dl) return toast('การดาวน์โหลดใช้ไม่ได้ในมุมมองนี้ ลองเปิดไฟล์ในเบราว์เซอร์โดยตรง');\n    try { await dl.save({ filename, data }); toast(`บันทึก ${filename} แล้ว`); }\n    catch (e){ if (e?.code==='declined') return; toast(e?.code==='rate_limited' ? 'มีหน้าต่างบันทึกเปิดอยู่ ลองอีกครั้งสักครู่' : `บันทึกไฟล์ไม่สำเร็จ (${e?.code||'error'})`); }\n    return;\n  }\n  const url = URL.createObjectURL(new Blob([data], { type: mime }));\n  const a = document.createElement('a'); a.href = url; a.download = filename; document.body.append(a); a.click(); a.remove();\n  setTimeout(()=>URL.revokeObjectURL(url), 5000); toast(`ดาวน์โหลด ${filename}`);\n}\n\nfunction relTop(n, root){ let y = 0; while (n && n !== root){ y += n.offsetTop; n = n.offsetParent; } return y; }\nasync function exportPdf(){\n  busy(true, 'กำลังสร้าง PDF…');\n  try {\n    await Promise.all([loadScript(LIBS.h2c), loadScript(LIBS.pdf)]);\n    await document.fonts.ready;\n    const el = $('rpt'), W = el.offsetWidth, Ht = el.offsetHeight, scale = 2;\n    const canvas = await html2canvas(el, { scale, backgroundColor: '#ffffff', logging: false });\n    const pageH = W * 277 / 210;\n    const cands = [...el.querySelectorAll('.rb, tbody tr:not(:first-child), li:not(:first-child), .focus-item, .r-foot')].map(n=>relTop(n, el)).filter(y=>y>0).sort((p,q)=>p-q);\n    const pages = []; let s = 0;\n    while (s < Ht - 1){\n      let e = s + pageH;\n      if (e >= Ht) e = Ht; else { const c = cands.filter(y=>y > s + pageH*0.4 && y <= e); if (c.length) e = c[c.length-1]; }\n      pages.push([s, e]); s = e;\n    }\n    const pdf = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4' });\n    const ascii = (state.data.dealer||'').replace(/[^\\x20-\\x7E]/g,'').trim();\n    pages.forEach(([s0, e0], i) => {\n      if (i) pdf.addPage();\n      const c = document.createElement('canvas'); c.width = canvas.width; c.height = Math.max(1, Math.round((e0 - s0) * scale));\n      const g = c.getContext('2d'); g.fillStyle = '#ffffff'; g.fillRect(0,0,c.width,c.height);\n      g.drawImage(canvas, 0, Math.round(s0*scale), canvas.width, c.height, 0, 0, canvas.width, c.height);\n      pdf.addImage(c.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 10, 210, (e0 - s0) * 210 / W);\n      pdf.setFontSize(8); pdf.setTextColor(110);\n      pdf.text(`CSI Report${ascii ? ' · ' + ascii : ''} · Created by Natchanon C.`, 12, 291);\n      pdf.text(`${i+1} / ${pages.length}`, 198, 291, { align: 'right' });\n    });\n    pdf.setProperties({ title: `CSI Report ${ascii}`, author: 'Natchanon C.' });\n    busy(false);\n    await saveFile(fileBase() + '.pdf', pdf.output('arraybuffer'), 'application/pdf');\n  } catch (e){ console.error(e); busy(false); toast('สร้าง PDF ไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่'); }\n}\n\nasync function exportXlsx(){\n  if (typeof XLSX==='undefined') return toast('โหลดตัวอ่าน Excel ไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วรีเฟรชหน้า');\n  const D = reportData(), d = state.data, r1 = v => v==null ? null : Math.round(v*10)/10;\n  const wb = XLSX.utils.book_new();\n  const add = (name, aoa, cols) => { const ws = XLSX.utils.aoa_to_sheet(aoa); if (cols) ws['!cols'] = cols.map(w=>({wch:w})); XLSX.utils.book_append_sheet(wb, ws, name); };\n  add('Summary', [\n    ['CSI Report', d.dealer], ['ช่วงข้อมูล', D.per.label], ['Report date (ไฟล์)', d.reportDate||''], ['วันที่สร้างรายงาน', today()], ['ไฟล์ต้นฉบับ', d.fileName],\n    ['ค้นหา', state.q||'-'], ['คะแนนที่วิเคราะห์', D.scores.join(', ')], [],\n    ['CSI โดยรวม (%)', r1(D.a.csi)], ['NPS (%)', r1(D.a.nps)], ['จำนวนแบบสำรวจ', D.rows.length], ['เคส Unhappy (1–2)', D.unhappy], [],\n    ['สรุปผล'], ...summaryLines(D).map(l=>[l.replace(/<[^>]+>/g,'')]),\n    ...(rstate.note.trim() ? [[], ['ความเห็นเพิ่มเติม', rstate.note.trim()]] : []),\n    [], ['Generated by CSI Score Analysis · Created by Natchanon C.']\n  ], [24, 90]);\n  add('By Question', [['ข้อ','หัวข้อ','Happy (4–5)','Neutral (3)','Unhappy (1–2)','N','คะแนน (%)', `เคสคะแนน ${D.scores.join(',')}`],\n    ...D.qs.map(q=>[`Q${q.i+1}`, stripQ(d.qText[q.i]), q.H, q.N3, q.U, q.N, r1(q.score), q.sel]),\n    [], ['CSI โดยรวม (Q1–Q8)', '', '', '', '', '', r1(D.a.csi)], ['NPS (Q9)', '', '', '', '', '', r1(D.a.nps)]], [8, 70, 11, 11, 13, 6, 11, 14]);\n  add('Monthly', [['เดือน','N', ...SHORT.map((s,i)=>`Q${i+1}`), 'CSI', 'NPS'],\n    ...D.monthly.map(x=>[monLabel(x.m), x.n, ...x.qs.map(q=>r1(q.score)), r1(x.csi), r1(x.nps)])], [10, 6, ...Array(11).fill(8)]);\n  add('Cases', [['เดือน','Week','วันที่รับรถ','วันที่ส่งมอบ','SP','VIN','ชื่อลูกค้า','ประเภทลูกค้า','หมวดงานซ่อม','ประเภทงานซ่อม', ...SHORT.map((s,i)=>`Q${i+1}`), 'CSI เคส (%)', `มีคะแนน ${D.scores.join(',')}`, ...SHORT.map((s,i)=>`เหตุผล Q${i+1}`), 'ข้อเสนอแนะอื่นๆ'],\n    ...[...D.rows].sort(caseSort).map(r=>[monLabel(r.m), r.w, r.ad, r.dd, r.sp, r.vin, r.nm, r.ct, r.rc, r.rt, ...r.s, r1(calcAll([r]).csi), hasSel(r)?'Y':'', ...r.c, r.o])],\n    [8, 9, 11, 11, 20, 20, 20, 18, 16, 30, ...Array(9).fill(5), 10, 10, ...Array(9).fill(28), 36]);\n  if (rstate.plan) add('Action Plan', [['ประเด็น','เคส','คะแนนข้อ (%)','สาเหตุ','แนวทางแก้ไข','ผู้รับผิดชอบ','กำหนดเสร็จ','สถานะ'],\n    ...D.focus.map(q=>[`Q${q.i+1} ${SHORT[q.i]}`, q.sel, r1(q.score), '', '', '', '', '']), ['', '', '', '', '', '', '', '']], [26, 6, 12, 30, 40, 16, 12, 12]);\n  const buf = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });\n  await saveFile(fileBase() + '.xlsx', buf, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');\n}\n\n$('reportBtn').onclick = openReport;\nrenderAll();\n<\/script>\n\n<script>\n(function(){\n  var P = window.parent, lang = 'th';\n  var T = { th:{plans:'Action Plan', add:'+ สร้าง Action Plan จากเคสนี้', addQ:'+ สร้าง Action Plan สำหรับข้อนี้'}, en:{plans:'Action Plans', add:'+ Create Action Plan for this case', addQ:'+ Create Action Plan for this question'} };\n  var tx = function(k){ return T[lang][k]; };\n  var post = function(m){ m.src = 'csi-ps'; P.postMessage(m, '*'); };\n  var st = document.createElement('style');\n  st.textContent = '#pick,#reportBtn,#apBtn{display:none!important} .rpt table,.rpt td,.rpt li,.rpt p{color:var(--r-ink)} .rpt .muted{color:var(--r-muted)} .rpt th{color:var(--r-muted)}';\n  document.head.appendChild(st);\n  var ctrls = document.querySelector('.ctrls');\n  var ab = document.createElement('button'); ab.className = 'btn'; ab.id = 'apBtn'; ab.textContent = tx('plans');\n  ab.onclick = function(){ post({type:'plans'}); };\n  ctrls.insertBefore(ab, ctrls.firstChild);\n  ['pick','dropcard'].forEach(function(id){ var e = document.getElementById(id); if (e) e.addEventListener('click', function(ev){ ev.stopImmediatePropagation(); ev.preventDefault(); post({type:'pick'}); }, true); });\n  window.addEventListener('drop', function(ev){ ev.stopImmediatePropagation(); ev.preventDefault(); var z = document.getElementById('dropzone'); if (z) z.hidden = true; if (ev.dataTransfer && ev.dataTransfer.files.length) post({type:'drop', file: ev.dataTransfer.files[0]}); }, true);\n  function addBtn(label, prefill){\n    var body = document.querySelector('#modalRoot .mbody'); if (!body) return;\n    var d = document.createElement('div'); d.style.cssText = 'margin-bottom:12px';\n    var b = document.createElem     else { qs = [...PB.qsel].sort((a,b) => a - b); cases = recs.filter(r => qs.some(i => r.s[i] != null && r.s[i] <= PB.max && !PB.off.has(i + '|' + r.sp))); }
    if (!cases.length) return;
    const problem = PB.mode === 'q' ? qs.map(i => `Q${i+1} ${qNm(i)}`).join(', ') : (cases.length === 1 ? `${cases[0].sp}: ` : '') + qs.map(i => `Q${i+1} ${qNm(i)}`).join(', ');
    openPlanForm(null, null, { problem, q: qs, sps: [...new Set(cases.map(r => r.sp))], months: [...new Set(cases.map(r => r.m))].sort() });
  },
  newPlanFrom: k => { const [ps, q] = k.split('|'); const sps = scopeRecs({ ignorePS: true }).filter(r => r.psKey === ps && r.s[+q] && r.s[+q] <= 2).map(r => r.sp).slice(0, 20); openPlanForm(null, null, { ps, q: [+q], sps, problem: `Q${+q+1} ${qShort(+q)}` }); },
  newPlanFromSP: k => { const r = S.byKey.get(k); if (!r) return; const q = r.s.map((s, i) => s && s <= 3 ? i : -1).filter(i => i >= 0); openPlanForm(null, null, { ps: r.psKey, q, sps: [r.sp], problem: q.length ? q.map(i => qShort(i)).join(', ') : '' }); },
  openPlan: k => { const [d, i] = k.split('|'); openPlan(d, i); },
  editPlan: k => { const [d, i] = k.split('|'); openPlanForm(d, i); },
  pfQ: (k, el) => el.setAttribute('aria-pressed', el.getAttribute('aria-pressed') !== 'true'),
  rmImg: k => { formImages.splice(+k, 1); renderThumbs(); },
  savePlan: k => savePlan(k),
  review: k => reviewPlan(k),
  plFilterPs: k => { PF.ps = PF.ps === k ? '' : k; renderAll(); },
  imgView: k => { const im = LB.list[+k]; if (im) openLightbox(im.url); },
  lbClose: () => $('lbx')?.remove(),
  theme: () => toggleTheme(),
  delAllPlans: (k, el) => armBtn(el, () => deleteAllPlans()),
  delPlan: (k, el) => armBtn(el, () => { const [d, i] = k.split('|'); deletePlan(d, i); }),
  delHist: (k, el) => armBtn(el, () => { const [d, i, kind, n] = k.split('|'); deleteHist(d, i, kind, n); }),
  rpKind: k => { RO.akind = k; RO.kind = ''; RO.onlyPlan = null; if (k === 'overview'){ RO.rsm = ''; RO.ps = ''; } else if (k === 'rsm'){ RO.ps = ''; if (!RO.rsm) RO.rsm = [...allRSM()][0] || ''; } else { RO.rsm = ''; if (!RO.ps) RO.ps = (allPS().find(p => p.hasData) || {}).k || ''; } renderAll(); },
  psReport: () => { setTab('dash'); setTimeout(() => PSF.frame && PSF.frame.contentWindow.postMessage({ src: 'csi-center', type: 'openReport', pre: { months: [...(RO.months || [])] } }, '*'), 150); },
  planReport: k => { if (!isAdminView()){ const [d0, i0] = k.split('|'); const p0 = findPlan(d0, i0); if (!p0) return; closeModal(); setTab('dash'); setTimeout(() => PSF.frame && PSF.frame.contentWindow.postMessage({ src: 'csi-center', type: 'openReport', pre: { q: p0.q || [], sps: p0.sps || [], months: (p0.months && p0.months.length) ? p0.months : [...(RO.months || [])] } }, '*'), 150); return; }
    const [d, i] = k.split('|'); const p = findPlan(d, i); if (!p) return; RO.onlyPlan = k; RO.ps = p.ps; RO.rsm = ''; RO.months = new Set(); RO.job = ''; RO.sec = { summary: false, ranking: false, common: false, qa: false, plans: true, cases: false }; closeModal(); F.tab = isAdminView() ? 'report' : 'sum'; if (!isAdminView()) RO.kind = 'sum'; renderAll(); window.scrollTo({ top: 0 }); },
  rpAllReport: () => { RO.onlyPlan = null; RO.sec = { summary: true, ranking: isAdminView(), common: true, qa: true, plans: true, cases: false }; renderAll(); },
  pickAny: () => $('gFile').click(),
  backRsm: () => backToRsm(),
  /* admin */
  pickCsi: () => $('gFile').click(),
  cancelCsi: () => { UP.parsed = null; UP.plan = null; renderAll(); },
  commitCsi: () => commitCsi(),
  pickMap: () => $('mapFile').click(),
  addUnlisted: () => addUnlisted(),
  addPsRow: () => addPsRow(),
  saveCal: () => saveCal(),
  cancelCal: () => { UP.calDraft = null; renderAll(); },
  calProv: k => setMonthProvisional(k),
  dlMap: () => downloadMapping(),
  saveMap: () => saveMap(),
  cancelMap: () => { UP.mapDraft = null; UP.mapDraftSets = null; renderAll(); },
  delMonth: () => { const m = $('delMonth').value; if (!m) return; $('delConfirm').innerHTML = `<span class="small">${t('ad.confirmDel', { m: monLabel(m) })}</span> <button class="btn sm danger" data-act="delMonthYes" data-key="${m}">${t('ad.yesDelete')}</button>`; },
  delMonthYes: async k => { busy(true, t('saving')); try { await deleteMonth(k); toast(t('saved2')); } catch (e){ toast(dbErrMsg(e)); } busy(false); },
  /* report */
  rpMonAll: () => { RO.months = new Set(); PB.sel.clear(); renderAll(); psMonthsPush(); },
  rpMon: k => { RO.months.has(k) ? RO.months.delete(k) : RO.months.add(k); PB.sel.clear(); renderAll(); psMonthsPush(); },
  rpPdf: () => exportPdf(),
  rpDocx: () => exportDocx(),
  rpPrint: () => printReport(),
};

document.addEventListener('click', e => {
  if (e.target.id === 'ov') return closeModal();
  const el = e.target.closest('[data-act]'); if (!el) { if (!e.target.closest('.gsearch')) $('gresults').hidden = true; return; }
  const fn = ACTS[el.dataset.act]; if (!fn) return;
  e.preventDefault(); fn(el.dataset.key, el);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ if ($('lbx')) return $('lbx').remove(); if ($('modalRoot').innerHTML) return closeModal(); $('gresults').hidden = true; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('path[data-act],tr[data-act]')){ e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
});
document.addEventListener('change', e => { const k = e.target.dataset?.map; if (k != null) setMapRow(k, e.target.value); const c = e.target.dataset?.calend; if (c) setMonthEnd(c, e.target.value); });

function bindHeader(){
  let tm; $('gsearch').addEventListener('input', () => { clearTimeout(tm); tm = setTimeout(renderSearchResults, 150); });
  $('gsearch').addEventListener('focus', renderSearchResults);
  $('gsearch').addEventListener('keydown', e => { if (e.key === 'Enter'){ const res = searchRecs(e.target.value); if (res.length === 1) openSP(res[0].key); else if (res.length){ F.data.search = e.target.value.trim(); F.data.page = 0; $('gresults').hidden = true; setTab('data'); } } });
  for (const b of document.querySelectorAll('#setSeg button')) b.onclick = () => setRsmSet(b.dataset.set);
  for (const b of document.querySelectorAll('#langSeg button')) b.onclick = () => { setLang(b.dataset.lang); RO.lang = b.dataset.lang; renderAll(); };
  $('gFile').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) handleFile(f); };
  window.addEventListener('dragover', e => { if (e.dataTransfer?.types?.includes('Files')) e.preventDefault(); });
  window.addEventListener('drop', e => { const f = e.dataTransfer?.files?.[0]; if (f){ e.preventDefault(); handleFile(f); } });
}
function openFromHash(){
  const h = decodeURIComponent(location.hash.slice(1));
  if (!h || !S.recs.length) return false;
  if (h.startsWith('sp-')){ const sp = h.slice(3).toUpperCase(); const r = S.recs.find(x => x.sp === sp); if (r){ openSP(r.key); return true; } }
  if (h.startsWith('vin-')){ openVIN(h.slice(4).toUpperCase()); return true; }
  if (['dash','q','data','plans','report','admin'].includes(h)){ F.tab = h; renderAll(); return true; }
  return false;
}
window.addEventListener('hashchange', () => openFromHash());

(async function init(){
  bindHeader();
  renderAll();
  await initCapabilities();
  startSync();
  renderAll();
  let tries = 0; const iv = setInterval(() => { if (openFromHash() || ++tries > 20 || !location.hash) clearInterval(iv); }, 500);
})();

</script>
