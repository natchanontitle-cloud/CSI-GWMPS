<title>CSI Score Analysis</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: service-desk console — header with global search, tab strip, sticky filter strip, panels */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface-2:#eaeef3; --line:#d5dce5;
  --fg:#16202c; --muted:#5a6878; --accent:#1f4f82; --accent-soft:#dbe7f4; --on-accent:#ffffff;
  --s1:#d92c2c; --s2:#ee8a1c; --s3:#e8b923; --s4:#4bb04f; --s5:#16834a;
  --good:#16834a; --warn:#b07900; --bad:#c62828;
  --good-bg:#dff2e6; --warn-bg:#fbf0d2; --bad-bg:#fbe1e1; --info-bg:#e3ecf6;
  --shadow:0 1px 2px rgba(20,35,55,.06),0 4px 14px rgba(20,35,55,.06);
  --scrim:rgba(10,18,28,.55);
  --f-display:"Bai Jamjuree","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media not all{:root:not([data-theme="light"]){
  --bg:#0f151d; --surface:#17202b; --surface-2:#1f2a37; --line:#2c3a4a;
  --fg:#e5ebf2; --muted:#9aa8b8; --accent:#7fb2e8; --accent-soft:#1d3550; --on-accent:#0f151d;
  --s1:#f05252; --s2:#f59e3b; --s3:#eac54f; --s4:#5cc263; --s5:#2fa866;
  --good:#4cc782; --warn:#e8b13a; --bad:#f06b6b;
  --good-bg:#183a29; --warn-bg:#3a3017; --bad-bg:#3d1d1f; --info-bg:#1d3550;
  --shadow:0 1px 2px rgba(0,0,0,.3); --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151d; --surface:#17202b; --surface-2:#1f2a37; --line:#2c3a4a;
  --fg:#e5ebf2; --muted:#9aa8b8; --accent:#7fb2e8; --accent-soft:#1d3550; --on-accent:#0f151d;
  --s1:#f05252; --s2:#f59e3b; --s3:#eac54f; --s4:#5cc263; --s5:#2fa866;
  --good:#4cc782; --warn:#e8b13a; --bad:#f06b6b;
  --good-bg:#183a29; --warn-bg:#3a3017; --bad-bg:#3d1d1f; --info-bg:#1d3550;
  --shadow:0 1px 2px rgba(0,0,0,.3); --scrim:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-size:18px;font-weight:700}
h3{font-size:15px;font-weight:700}
p{margin:0}
.mono{font-family:var(--f-mono);font-size:12.5px}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.small{font-size:12.5px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

/* header */
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 18px;padding-top:18px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
h1{font-size:clamp(20px,3vw,27px);font-weight:700}
.hright{display:flex;flex-wrap:wrap;align-items:center;gap:8px;flex:1 1 380px;justify-content:flex-end;min-width:0}
.gsearch{position:relative;flex:1 1 280px;max-width:440px;min-width:0}
.gsearch input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-family:var(--f-mono);font-size:13px}
.gresults{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);z-index:40;max-height:360px;overflow:auto}
.gresults button{display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:8px 12px;cursor:pointer}
.gresults button:hover,.gresults button:focus{background:var(--surface-2)}
.gresults .empty{padding:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:var(--surface);padding:6px 11px;cursor:pointer;font-size:12.5px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.linkbtn{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-size:inherit;text-decoration:underline;text-underline-offset:2px}
.banner{border-radius:10px;padding:10px 14px;font-size:13px;background:var(--warn-bg);color:var(--fg);border:1px solid var(--warn)}
.banner.info{background:var(--info-bg);border-color:var(--accent)}

/* tabs */
nav.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
nav.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;font-family:var(--f-display);font-size:14.5px}
nav.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
nav.tabs .count{font-family:var(--f-body);font-size:11px;background:var(--bad-bg);color:var(--bad);border-radius:9px;padding:0 6px;margin-left:4px}

/* filters */
.filters{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
@media (max-width:760px){.filters{position:static}}
.frow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;min-width:0}
.flabel{font-size:12px;font-weight:600;color:var(--muted);min-width:70px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 11px;cursor:pointer;font-size:12.5px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip.sc{display:inline-flex;align-items:center;gap:6px}
.chip.sc .dot{width:10px;height:10px;border-radius:50%}
.chip.sc[aria-pressed="true"]{background:var(--surface-2);color:var(--fg);border-color:var(--fg)}
select.sel,input.inp,textarea.inp{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;min-width:0;max-width:100%}
textarea.inp{width:100%;min-height:70px;resize:vertical}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:13px}
.crumbs button{background:none;border:0;color:var(--accent);cursor:pointer;padding:2px 4px;border-radius:4px;font-weight:600}
.crumbs button[disabled]{color:var(--fg);cursor:default}
.crumbs span{color:var(--muted)}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.kpi .lbl{font-size:12px;color:var(--muted);font-weight:500}
.kpi .val{font-family:var(--f-display);font-size:28px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:11.5px;color:var(--muted)}
.kpi.hero{border-color:var(--accent);box-shadow:var(--shadow)}

/* panels */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.phead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:10px}
.phead p{margin-top:2px;color:var(--muted);font-size:12.5px}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pscard{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 18px;background:var(--accent-soft);border-radius:12px;padding:14px 16px}
.pscard div span{display:block;font-size:11.5px;color:var(--muted)}
.pscard div b{font-family:var(--f-display);font-size:18px}

/* vertical bars */
.chartbox{overflow-x:auto;padding-bottom:4px}
.vchart{position:relative;height:280px;display:grid;grid-template-rows:1fr auto;padding-left:38px;min-width:100%}
.plot{position:relative;border-bottom:1px solid var(--muted);margin-top:22px}
.grid{position:absolute;left:0;right:0;border-top:1px dashed var(--line)}
.grid span{position:absolute;left:-38px;top:-8px;width:32px;text-align:right;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.zero{position:absolute;left:0;right:0;border-top:1px solid var(--muted)}
.bars{position:absolute;inset:0;display:flex;align-items:stretch;gap:6px;padding:0 4px}
.barcol{flex:1;position:relative;cursor:pointer;border-radius:6px 6px 0 0;min-width:0;background:none;border:0;padding:0}
.barcol:hover,.barcol:focus-visible{background:var(--surface-2)}
.barcol.sel{background:var(--accent-soft)}
.stack{position:absolute;left:12%;right:12%;display:flex;flex-direction:column-reverse;border-radius:4px 4px 0 0;overflow:hidden;transition:height .25s}
.stack i{display:block;width:100%}
.barval{position:absolute;left:-10px;right:-10px;text-align:center;font-weight:700;font-size:11.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.xlabels{display:flex;gap:6px;padding:6px 4px 0}
.xlabels div{flex:1;text-align:center;font-size:11px;line-height:1.25;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.xlabels b{display:block;color:var(--fg);font-family:var(--f-display);font-size:12px}
.vchart.rot .xlabels div{height:118px;position:relative}
.vchart.rot .xlabels div span{position:absolute;top:4px;left:50%;transform-origin:0 0;transform:rotate(55deg);white-space:nowrap;font-size:11px;color:var(--fg);text-align:left}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.note{font-size:12px;color:var(--muted);line-height:1.6}

/* top lists */
.toplist{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.toplist button{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;cursor:pointer}
.toplist button:hover{border-color:var(--accent)}
.toplist .rk{font-family:var(--f-display);font-weight:700;color:var(--muted)}
.toplist .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toplist .nm small{display:block;color:var(--muted);font-size:11.5px}

/* pies */
.pies{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.pie{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.pie.sel{border-color:var(--accent);box-shadow:var(--shadow)}
.pie h4{font-size:13.5px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.pie h4 button{font:inherit;background:none;border:0;padding:0;cursor:pointer;color:var(--fg);text-align:left}
.pie .body{display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:center}
.pie svg{width:120px;height:120px}
.pie svg path{cursor:pointer;stroke:var(--surface);stroke-width:1.5}
.pie svg path:hover{opacity:.82}
.pie svg text{fill:var(--fg);font-family:var(--f-display);font-weight:700}
.pie table{font-size:12px;border-collapse:collapse;width:100%}
.pie td{padding:2px 4px}
.pie td.r{text-align:right;font-variant-numeric:tabular-nums}
.pie tr{cursor:pointer}
.pie tr:hover td{background:var(--surface-2)}

/* tables */
.tblwrap{overflow:auto;border:1px solid var(--line);border-radius:10px;max-width:100%}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t td{color:var(--fg)}
table.t th,table.t td{padding:7px 9px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
table.t th{background:var(--surface-2);font-weight:600;font-size:12px;color:var(--muted);white-space:nowrap;position:sticky;top:0;z-index:1}
table.t th.sortable{cursor:pointer;user-select:none}
table.t th.sortable:hover{color:var(--fg)}
table.t th .arr{font-size:10px;margin-left:3px}
table.t td.r,table.t th.r{text-align:right}
table.t td.c,table.t th.c{text-align:center}
table.t tbody tr:last-child td{border-bottom:0}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--surface-2)}
table.t tr.total td{background:var(--surface-2);font-weight:700}
table.t td.nw{white-space:nowrap}
.calc{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-weight:700;font-variant-numeric:tabular-nums;font-size:12px;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--info-bg);color:var(--accent)}
.pill.mute{background:var(--surface-2);color:var(--muted)}
.sc-chip{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:5px;font-weight:700;font-size:12px;color:#fff;font-variant-numeric:tabular-nums}
.sc-chip.na{background:var(--surface-2);color:var(--muted)}
.sc-chip.s3{color:#3a2c00}
.splink{font-family:var(--f-mono);font-size:12.5px;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px;white-space:nowrap;text-align:left}
.cmt{min-width:220px;max-width:440px;white-space:normal}
.cmt div{margin-bottom:3px}
.cmt b{font-family:var(--f-display);font-size:12px;color:var(--muted);margin-right:4px}
.pager{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px}

/* modal */
.overlay{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;align-items:flex-start;justify-content:center;
  padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px));overflow-y:auto}
.modal{background:var(--surface);border-radius:14px;width:min(980px,100%);box-shadow:0 20px 60px rgba(0,0,0,.35);display:flex;flex-direction:column;min-width:0}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.mhead h3{font-size:18px}
.mbody{padding:16px 20px 20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.xbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:18px;flex:none}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px 16px;font-size:13px}
.meta div span{display:block;font-size:11.5px;color:var(--muted)}
.qlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.qitem{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:9px 12px;border-bottom:1px solid var(--line);align-items:start}
.qitem:last-child{border-bottom:0}
.qitem .qc{grid-column:2;font-size:13px;color:var(--bad)}
.other{background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:13px}

/* plans */
.plans{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.plan{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;background:var(--surface);cursor:pointer;text-align:left}
.plan:hover{border-color:var(--accent)}
.plan h4{font-size:14px}
.plan .chips{display:flex;flex-wrap:wrap;gap:4px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
@media (max-width:700px){.form{grid-template-columns:1fr}}
.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted)}
.form label .req{color:var(--bad)}
.form .inp,.form .sel{color:var(--fg);font-weight:400;font-size:14px}
.qpick{display:flex;flex-wrap:wrap;gap:6px}
.qgrp{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:10px;display:grid;gap:6px}
.qrow{display:flex;gap:10px;align-items:flex-start;border-top:1px dashed var(--line);padding-top:6px;font-size:13px}
.qrow .qcm{display:block;color:var(--muted);margin-top:2px;line-height:1.4}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumb{position:relative;width:110px;height:84px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface-2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:var(--scrim);color:#fff;cursor:pointer;line-height:1}
.timeline{display:flex;flex-direction:column;gap:6px;border-left:2px solid var(--line);padding-left:12px;font-size:12.5px}
.timeline div b{font-weight:600}
.drop{border:2px dashed var(--accent);background:var(--accent-soft);border-radius:12px;padding:22px;text-align:center;cursor:pointer;display:flex;flex-direction:column;gap:4px;align-items:center;width:100%;color:var(--fg)}
.drop b{font-family:var(--f-display);font-size:17px;color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.stats div{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.stats span{display:block;font-size:11.5px;color:var(--muted)}
.stats b{font-family:var(--f-display);font-size:20px}
.progress{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .2s}

/* report */
:root{--r-ink:#16202c;--r-muted:#5a6878;--r-line:#d5dce5;--r-soft:#f1f4f8;--r-accent:#1f4f82;--r-accent-soft:#e3ecf6;--r-good:#16834a;--r-warn:#a87400;--r-bad:#c62828;--r-good-bg:#dff2e6;--r-warn-bg:#fbf0d2;--r-bad-bg:#fbe1e1;--r-paper:#ffffff;--r-backdrop:#5b6573}
.ropts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 18px}
.ropts fieldset{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.ropts legend{font-size:12px;font-weight:600;color:var(--muted);padding:0 4px}
.ropts label{display:flex;gap:6px;align-items:center;font-size:13px;cursor:pointer}
.rscroll{overflow:auto;background:var(--r-backdrop);padding:24px 12px;border-radius:12px;max-height:80vh}

function t(key, vars, lang){
  const e = DICT[key]; let s = e ? (e[(lang || L) === 'en' ? 1 : 0] ?? e[0]) : key;
  if (vars) s = s.replace(/\{(\w+)\}/g, (m, k) => vars[k] != null ? vars[k] : m);
  return s;
}

const QN = 9;
const MON_EN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MON_TH = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

const fmtPct = v => v == null ? '–' : (Math.round(v*10)/10).toFixed(1) + '%';
const fmt1 = v => v == null ? '–' : (Math.round(v*10)/10).toFixed(1);

const nowISO = () => new Date().toISOString();

const monLabel = (k, lang) => { if (!k || k.length < 7) return k || '–'; const [y,m] = k.split('-'); return (lang || L) === 'en' ? `${MON_EN[+m-1]} ${y.slice(2)}` : `${MON_TH[+m-1]} ${String(+y+543).slice(2)}`; };
const shortPS = n => String(n||'').replace(/^GWM\s+/i,'');
const cleanStr = v => { if (v == null) return ''; const s = String(v).replace(/[​ ]/g,' ').replace(/\s+/g,' ').trim(); return (s === '0' || s === '-') ? '' : s; };

/* PS key: tolerant of trailing dots, case and spacing; ASCII-safe for document ids */
function psKeyOf(name){
  const n = String(name||'').replace(/[​ ]/g,' ').toLowerCase().replace(/\s+/g,' ').replace(/[.\s]+$/,'').trim();
  let k = n.replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
  if (!k){ let h = 0; for (const ch of n) h = (h*31 + ch.charCodeAt(0)) >>> 0; k = 'ps-' + h.toString(36); }
  k = k.slice(0,120); return PS_ALIAS[k] || k;
}
const psDisplay = name => String(name||'').replace(/[​ ]/g,' ').replace(/\s+/g,' ').replace(/[.\s]+$/,'').trim();

function toDate(v){
  if (v == null || v === '') return null;
  if (v instanceof Date && !isNaN(v)) return `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}-${String(v.getDate()).padStart(2,'0')}`;
  if (typeof v === 'number' && v > 20000 && v < 80000){ const d = XLSX.SSF.parse_date_code(Math.floor(v + 1e-6)); return `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`; }
  const s = String(v).trim(); let m;
  if ((m = s.match(/^(\d{4})-(\d{1,2})(?:-(\d{1,2}))?/))) return `${m[1]}-${m[2].padStart(2,'0')}-${(m[3]||'1').padStart(2,'0')}`;
  if ((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/))) { let y = +m[3]; if (y > 2400) y -= 543; return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`; }
  const d = new Date(s); return isNaN(d) ? null : toDate(d);

/* Period sheet → {start, ends, weeks}; every month in the sheet counts as confirmed */
function parseCalendarWorkbook(wb){
  for (const strict of [true, false]) for (const name of wb.SheetNames){
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, raw:true, defval:null});
    for (let h = 0; h < Math.min(aoa.length, 15); h++){
      const hdr = (aoa[h]||[]).map(v => String(v ?? '').trim());
      let dc = hdr.findIndex(x => /^end ?date$/i.test(x)); if (dc < 0 && !strict) dc = hdr.findIndex(x => /^(date|วันที่)$/i.test(x));
      if (hdr.some(x => /^q1(?![0-9])/i.test(x))) continue;
      const mc = hdr.findIndex(x => /^(month|เดือน)$/i.test(x));
      if (dc >= 0 && mc >= 0){
        const wc = hdr.findIndex(x => /^(week|สัปดาห์)$/i.test(x));
        const sc = hdr.findIndex(x => /^(status|สถานะ)/i.test(x));
        const ends = {}, weeks = {}, provM = new Set(); let start = null, n = 0;
        for (let r = h+1; r < aoa.length; r++){
          const row = aoa[r] || []; const d = toDate(row[dc]), m = toDate(row[mc]);
          if (!d || !m) continue; const ym = m.slice(0,7); n++;
          if (sc >= 0 && /provisional|ชั่วคราว/i.test(String(row[sc] || ''))) provM.add(ym);
          if (!start || d < start) start = d;
          if (!ends[ym] || d > ends[ym]) ends[ym] = d;
          if (wc >= 0 && cleanStr(row[wc])) weeks[d] = cleanStr(row[wc]).replace(/\s+/g,' ');
        }
        for (const m of provM) delete ends[m];
        if (n) return { start, ends, weeks, n, sheet: name };
      }
    }
  }
  throw new Error(t('err.calHeader'));
}

/* ---------- Excel parsing & validation ---------- */
function findHeader(wb){
  let best = null;
  for (const name of wb.SheetNames){
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, raw:true, defval:null});
    for (let h = 0; h < Math.min(aoa.length, 30); h++){
      const hdr = (aoa[h]||[]).map(v => String(v ?? '').replace(/\s+/g,' ').trim());
      const q = mapQ(hdr);
      const hasId = hdr.some(t => /repair order|^vin|^sp$|^ro$/i.test(t));
      if (q.filter(x => x >= 0).length >= 8 && hasId){
        const score = (hdr.some(t => /^month$/i.test(t)) ? 2e7 : 0) + (hdr.some(t => /^store[ _]?name$/i.test(t)) ? 1e7 : 0) + aoa.filter(r => r && r.some(v => v != null && v !== '')).length - h;
        if (!best || score > best.score) best = { name, aoa, h, hdr, q, score };
        break;
      }
    }
  }
  return best;
}
function mapQ(hdr){ return [...Array(QN)].map((_,i) => hdr.findIndex(t => new RegExp(`^Q${i+1}(?![0-9])`,'i').test(t) && !/comment|เหตุใด|ถามเมื่อ|result/i.test(t))); }

/* returns {fileName, sheet, format, recs[], errors[], dupInFile, total, header} */
function parseCsiWorkbook(wb, fileName){
  const H = findHeader(wb);
  if (!H) throw new Error(t('err.noHeader'));
  const { aoa, h, hdr, q } = H;
  const col = re => hdr.findIndex(x => re.test(x));
  const C = {
    ps: col(/^(store[ _]?name|ps|dealer|ศูนย์บริการ)$/i), sp: col(/repair order|^sp$|^ro$/i), vin: col(/^vin/i),
    ad: col(/^arrival( time| date)?$/i), dd: col(/^delivery( time| date)?$/i), m: col(/^month$/i), w: col(/^week$/i),
    item: (() => { const a = col(/repair item name/i); return a >= 0 ? a : col(/^repair type$/i); })(),
    nm: (() => { const a = col(/car owner/i); return a >= 0 ? a : col(/^sender$/i); })(),
    ct: col(/customer type/i), o: col(/other comment|ข้อเสนอแนะ/i),
  };
  const cq = [...Array(QN)].map((_,i) => hdr.findIndex(x => new RegExp(`^Q${i+1}\\s*comment|ถามเมื่อ\\s*Q${i+1}\\b`,'i').test(x)));
  const missing = [];
  if (C.ps < 0) missing.push('Store Name'); if (C.sp < 0) missing.push('Repair Order (SP)');
  if (C.dd < 0 && C.ad < 0 && C.m < 0) missing.push('Delivery Time / Month');
  if (missing.length) throw new Error(t('err.missingCols', { cols: missing.join(', ') }));
  const recs = [], errors = [], seen = new Map(), skippedRows = []; let dupInFile = 0, total = 0, outCal = 0; const provM = new Set();
  for (let r = h + 1; r < aoa.length; r++){
    const row = aoa[r]; if (!row || row.every(v => v == null || v === '')) continue;
    const line = r + 1;
    const sp = cleanStr(row[C.sp]).toUpperCase(), psRaw = cleanStr(row[C.ps]);
    /* grand-total / summary / footer rows have no Repair Order and no Store Name (or a "Total" label) — not data, skip silently */
    if ((!sp && !psRaw) || (!sp && /^(grand\s*)?total|^sum\b|^รวม|^ผลรวม|^count\b/i.test(psRaw)) || (!sp && row.some(v => typeof v === 'string' && /^(grand\s*)?total$|^รวม(ทั้งหมด)?$|^ผลรวม$/i.test(v.trim())))){ skippedRows.push(line); continue; }
    total++;
    const ad = C.ad >= 0 ? toDate(row[C.ad]) : null, dd = C.dd >= 0 ? toDate(row[C.dd]) : null;
    const mcol = C.m >= 0 ? toDate(row[C.m]) : null;
    const per = periodOf(dd || ad, mcol);
    const m = per.m;
    if (!mcol && (dd || ad) && !per.inCal) outCal++;
    if (per.prov && m) provM.add(m);
    let bad = null;
    const s = q.map((ci, i) => {
      if (ci < 0) return 0;
      const v = row[ci];
      if (v == null || v === '' || v === 0 || v === '0') return 0;
      const n = Number(String(v).trim());
      if (Number.isInteger(n) && n >= 1 && n <= 5) return n;
      bad = bad || t('err.badScore', { q: i+1, v: String(v).slice(0,12) });
      return 0;
    });
    if (!sp) bad = t('err.noSP');
    else if (!psRaw) bad = t('err.noPS');
    else if (!m) bad = t('err.noDate');
    else if (s.every(x => !x)) bad = bad || t('err.noScore');
    if (bad){ errors.push({ line, sp, ps: psRaw, reason: bad }); continue; }
    const rec = { key: `${sp}|${dd || ad || m}`, m, ad: ad || '', dd: dd || '', sp, vin: C.vin >= 0 ? cleanStr(row[C.vin]).toUpperCase() : '',
      item: C.item >= 0 ? cleanStr(row[C.item]) : '', nm: C.nm >= 0 ? cleanStr(row[C.nm]) : '', ct: C.ct >= 0 ? cleanStr(row[C.ct]) : '',
      w: (C.w >= 0 ? cleanStr(row[C.w]) : '') || per.w || '', ps: psDisplay(psRaw), psKey: psKeyOf(psRaw), s,
      c: cq.map(ci => ci < 0 ? '' : cleanStr(row[ci])), o: C.o >= 0 ? cleanStr(row[C.o]) : '' };
    if (seen.has(rec.key)){ dupInFile++; recs[seen.get(rec.key)] = rec; continue; }
    seen.set(rec.key, recs.length); recs.push(rec);
  }
  return { fileName, sheet: H.name, recs, errors, dupInFile, total, skippedRows, outCal, provMonths: [...provM].sort(), monthCol: C.m >= 0, format: C.m >= 0 && C.vin >= 0 ? 'summary' : 'raw' };
}

/* which kind of file is this?  Raw data (many PS) → RSM file.  The original single-partner "CSI Weekly result" → PS file. */
function detectKind(parsed){
  const keys = new Set(parsed.recs.map(r => r.psKey));
  return parsed.format === 'summary' && keys.size === 1 ? 'ps' : 'rsm';
}

function parseMappingWorkbook(wb){

/* ---------- storage encoding: one month split into parts under 180 KB ---------- */
const PART_BYTES = 180000;
const enc = new TextEncoder();
function encodeRow(r, psIdx, itemIdx){
  return [psIdx, r.ad, r.dd, r.sp, r.vin, itemIdx, r.s.join(''), r.c.some(Boolean) ? r.c : 0, r.o, r.nm, r.ct, r.w, r.src || ''];
}
function rowBytes(r, cur){
  return enc.encode(JSON.stringify(encodeRow(r, 0, 0))).length + 2
    + (cur._psI.has(r.psKey) ? 0 : r.psKey.length + enc.encode(r.ps).length + 8)
    + (cur._itI.has(r.item) ? 0 : enc.encode(r.item).length + 4);
}
function encodeMonth(m, recs, meta){
  const sorted = [...recs].sort((a,b) => a.psKey < b.psKey ? -1 : a.psKey > b.psKey ? 1 : (a.key < b.key ? -1 : 1));
  const fresh = () => ({ ps: [], psN: [], items: [], rows: [], _bytes: 300, _psI: new Map(), _itI: new Map() });
  const parts = []; let cur = fresh();
  for (const r of sorted){
    if (cur.rows.length && cur._bytes + rowBytes(r, cur) > PART_BYTES){ parts.push(cur); cur = fresh(); }
    const est = rowBytes(r, cur);
    let pi = cur._psI.get(r.psKey); if (pi == null){ pi = cur.ps.length; cur._psI.set(r.psKey, pi); cur.ps.push(r.psKey); cur.psN.push(r.ps); }
    let ii = cur._itI.get(r.item); if (ii == null){ ii = cur.items.length; cur._itI.set(r.item, ii); cur.items.push(r.item); }
    cur.rows.push(encodeRow(r, pi, ii)); cur._bytes += est;
  }
  if (cur.rows.length) parts.push(cur);
  return parts.map((p, i) => ({ m, i, n: parts.length, ps: p.ps, psN: p.psN, items: p.items, rows: p.rows, updatedAt: meta.at, by: meta.by || null }));
}
function decodePart(d){
  const out = [];
  for (const x of d.rows || []){
    const s = String(x[6]||'').padEnd(QN,'0').split('').map(Number);
    const c = Array.isArray(x[7]) ? x[7].map(v => v || '') : Array(QN).fill('');
    const ad = x[1], dd = x[2], sp = x[3];
    out.push({ key: `${sp}|${dd || ad || d.m}`, m: d.m, ad, dd, sp, vin: x[4]||'', item: d.items[x[5]] ?? '', s, c, o: x[8]||'', nm: x[9]||'', ct: x[10]||'', w: x[11]||'', src: x[12]||'',
      psKey: d.ps[x[0]], ps: d.psN[x[0]] });
  }
  return out;
}
/* job type from the Repair Order prefix: BP = Body & Paint, everything else (SP) = General Repair */
const jobOf = sp => /^BP/i.test(sp || '') ? 'BP' : 'GR';
const recSig = r => JSON.stringify([r.ad, r.dd, r.vin, r.item, r.s.join(''), r.c, r.o, r.nm, r.ct, r.w, r.psKey]);

/* ---------- aggregation ---------- */
function agg(recs){
  const qs = Array.from({length:QN}, () => ({ d:[0,0,0,0,0], N:0 }));
  let bad = 0, allGood = 0;
  for (const r of recs){
    let anyBad = false, allG = true;
    for (let i = 0; i < QN; i++){ const s = r.s[i]; if (!s) continue; qs[i].d[s-1]++; qs[i].N++; if (s <= 2) anyBad = true; if (s < 4) allG = false; }
    if (anyBad) bad++; if (allG) allGood++;
  }
  for (const q of qs){ q.H = q.d[3]+q.d[4]; q.U = q.d[0]+q.d[1]; q.N3 = q.d[2]; q.score = q.N ? (q.H-q.U)/q.N*100 : null; q.goodPct = q.N ? q.H/q.N*100 : null; q.badPct = q.N ? q.U/q.N*100 : null; }
  const cq = qs.slice(0,8).filter(q => q.score != null);
  const csiSum = cq.reduce((a,q) => a + q.score, 0);
  return { n: recs.length, qs, csi: cq.length ? csiSum/cq.length : null, csiSum, csiCnt: cq.length, nps: qs[8].score, bad, allGood };
}
function groupBy(arr, fn){ const m = new Map(); for (const x of arr){ const k = fn(x); let a = m.get(k); if (!a) m.set(k, a = []); a.push(x); } return m; }
const minScore = r => { let m = 9; for (const s of r.s) if (s && s < m) m = s; return m; };
const recCsi = r => agg([r]).csi;

/* in-memory store with the same surface, used when the page runs outside claude.ai */
function memDB(){
  const docs = new Map(), lis = new Set();
  /* action plans survive in this browser (localStorage); everything else stays in memory */
  const LSK = 'csi2-plans';
  try { const o = JSON.parse(localStorage.getItem(LSK) || '{}'); for (const k of Object.keys(o)) if (k.startsWith('plans/')) docs.set(k, o[k]); } catch (e) {}
  try { const mo = JSON.parse(localStorage.getItem('csi2-map') || 'null'); if (mo) docs.set('meta/mapping', mo); } catch (e) {}
  const persist = () => {
    try { const mp = docs.get('meta/mapping'); if (mp) localStorage.setItem('csi2-map', JSON.stringify(mp)); } catch (e) {}
    try {
      const o = {}; for (const [k, v] of docs) if (k.startsWith('plans/') && v && Object.keys(v.items || {}).length) o[k] = v;
      if (Object.keys(o).length) localStorage.setItem(LSK, JSON.stringify(o)); else localStorage.removeItem(LSK);
    } catch (e) { window.__lsFail = true; setTimeout(() => { try { toast(th_('พื้นที่เก็บในเบราว์เซอร์เต็ม — ลบแผนเก่าหรือรูป', 'Browser storage is full — delete old plans or images')); } catch (_) {} }, 0); }
  };
  const snap = (path) => { const d = docs.get(path); return { id: path.split('/').pop(), exists: !!d, data: () => d ? JSON.parse(JSON.stringify(d)) : undefined, metadata: { fromCache:false, hasPendingWrites:false } }; };
  const notify = () => setTimeout(() => lis.forEach(f => f()), 0);
  const collSnap = (cp) => { const ds = [...docs.keys()].filter(p => p.startsWith(cp + '/') && p.split('/').length === cp.split('/').length + 1).sort().map(snap); return { docs: ds, size: ds.length, empty: !ds.length, docChanges: () => [], metadata: {} }; };
  const docRef = (path) => ({ id: path.split('/').pop(), path,
    get: async () => snap(path),
    set: async (d) => { docs.set(path, JSON.parse(JSON.stringify(d))); persist(); notify(); },
    update: async (d) => { const cur = docs.get(path); if (!cur) throw { code: 'invalid_argument', message: 'missing' }; docs.set(path, deepMerge(cur, JSON.parse(JSON.stringify(d)))); persist(); notify(); },
    delete: async () => { docs.delete(path); persist(); notify(); },
    acquire: async () => ({ acquired: true }),
    onSnapshot: (next) => { const f = () => next(snap(path)); lis.add(f); setTimeout(f, 0); return () => lis.delete(f); },
    collection: (p) => collRef(path + '/' + p) });
  const collRef = (cp) => ({ path: cp, doc: (id) => docRef(cp + '/' + (id || uid('d'))),
    get: async () => collSnap(cp), where(){ return this; }, orderBy(){ return this; }, limit(){ return this; },
    onSnapshot: (next) => { const f = () => next(collSnap(cp)); lis.add(f); setTimeout(f, 0); return () => lis.delete(f); },
    add: async (d) => { const r = docRef(cp + '/' + uid('d')); await r.set(d); return r; } });
  return { doc: docRef, collection: collRef, _docs: docs };
}
function deepMerge(a, b){
  if (!b || typeof b !== 'object' || Array.isArray(b)) return b;
  const out = (a && typeof a === 'object' && !Array.isArray(a)) ? { ...a } : {};
  for (const k of Object.keys(b)) out[k] = (b[k] && typeof b[k] === 'object' && !Array.isArray(b[k])) ? deepMerge(out[k], b[k]) : b[k];
  return out;
}

async function retryWrite(fn){
  for (let i = 0; ; i++){
    try { return await fn(); }
    catch (e){
      if (i < 4 && (e?.code === 'resource_exhausted' || e?.code === 'unavailable')){ await sleep(600 * 2**i + Math.random()*300); continue; }
      throw e;
    }
  }
}
function dbErrMsg(e){
  if (e?.code === 'quota_exceeded') return t('err.quota');
  if (e?.code === 'invalid_argument') return t('err.denied');
  return t('err.save') + (e?.code ? ` (${e.code})` : '');
}

let renderQueued = false;

function startSync(){
  const db = S.db;
  if (S.me.canEdit){
    db.collection('csi').onSnapshot(snap => {
      const seen = new Set(); let changed = false;
      for (const d of snap.docs){
        seen.add(d.id);
        const prev = S.parts.get(d.id);
        if (prev && prev.snap === d) continue;
        const body = d.data();
        S.parts.set(d.id, { snap: d, doc: body, recs: decodePart(body) }); changed = true;
      }
      for (const id of [...S.parts.keys()]) if (!seen.has(id)){ S.parts.delete(id); changed = true; }
      if (changed || !S.ready){ rebuildRecs(); S.ready = true; queueRender(); maybeEnsureRanks(); }
    }, e => { S.syncError = e?.code; S.ready = true; queueRender(); });
    db.doc('meta/mapping').onSnapshot(s => {

      if (!sets && d.rows && Object.keys(d.rows).length) sets = { RSM1: d.rows };
      const pick = k => (sets && sets[k] && Object.keys(sets[k]).length) ? cleanMap(sets[k]) : DEFAULT_MAPS[k];
      S.maps = { RSM1: pick('RSM1'), RSM2: pick('RSM2') }; S.mapping = S.maps[MAPSET];
      S.mappingIsDefault = !(sets && (Object.keys(sets.RSM1 || {}).length || Object.keys(sets.RSM2 || {}).length)); S.mappingVer++; queueRender();
    }, () => {});
    db.doc('meta/calendar').onSnapshot(s => { S.calendar = normalizeCal((s.exists && s.data()) || {}); refreshCal(); queueRender(); }, () => {});
    db.doc('meta/uploads').onSnapshot(s => { S.uploads = (s.exists && s.data().list) || []; queueRender(); }, () => {});
    db.collection('plans').onSnapshot(snap => { S.plansDocs = new Map(snap.docs.map(d => [d.id, d.data()])); resolveNames(); queueRender(); }, () => {});
  } else {
    S.ready = true;
  }
  if (S.me.id) db.doc('plans/' + S.me.id).onSnapshot(s => { S.myPlanDoc = s.exists ? s.data() : null; queueRender(); }, () => {});
  db.collection('public').onSnapshot(snap => {
    const m = new Map(); for (const d of snap.docs) if (d.id.startsWith('rank_')) m.set(d.id, d.data());
    S.ranks = m; S.ranksLoaded = true; queueRender(); maybeEnsureRanks();
  }, () => {});
}
function rebuildRecs(){

/* ---------- import (upsert by SP + delivery date) ---------- */
function planImport(parsed, scopeRsm){
  const out = { add: [], upd: [], same: 0, skipped: 0, unmapped: new Map(), unlisted: new Map(), unlistedN: 0, months: new Set(), psSet: new Set() };
  for (const r of parsed.recs){
    if (REMOVED_PS.has(r.psKey)){ out.removedN = (out.removedN || 0) + 1; continue; }
    if (!S.mapping[r.psKey]){ out.unlisted.set(r.psKey, r.ps); out.unlistedN++; continue; }   /* not in the RSM list file → not imported */
    const rsm = rsmOf(r.psKey);
    if (!rsm) out.unmapped.set(r.psKey, r.ps);
    if (scopeRsm && rsm !== scopeRsm){ out.skipped++; continue; }
    const ex = S.byKey.get(r.key);
    if (!ex) out.add.push(r);
    else if (recSig(ex) === recSig(r)) { out.same++; continue; }
    else out.upd.push(r);
    out.months.add(r.m); out.psSet.add(r.psKey);
  }
  return out;
}
async function commitImport(plan, parsed, scopeRsm, onProgress){
  const db = S.db, at = nowISO(), srcId = uid('u');
  const lock = db.doc('locks/import');
  try { const l = await lock.acquire({ holder: S.me.id || 'me', ttlMs: 300000 }); if (l && l.acquired === false) throw new Error(t('err.locked')); }
  catch (e){ if (e?.message === t('err.locked')) throw e; }
  const changes = [...plan.add, ...plan.upd].map(r => ({ ...r, src: srcId }));
  const byMonth = groupBy(changes, r => r.m);
  const months = [...byMonth.keys()].sort();
  let step = 0; const steps = months.length + 1; const monthRecs = {};
  for (const m of months){
    const merged = new Map(S.cRecs.filter(r => r.m === m).map(r => [r.key, r]));
    for (const r of byMonth.get(m)) merged.set(r.key, r);
    const parts = encodeMonth(m, [...merged.values()], { at, by: S.me.id });
    const oldIds = [...S.parts.keys()].filter(id => S.parts.get(id).doc.m === m);
    monthRecs[m] = [...merged.values()];
    for (const p of parts) await retryWrite(() => db.doc(`csi/${m}_${p.i}`).set(p));
    for (const id of oldIds){ const i = +id.split('_').pop(); if (i >= parts.length) await retryWrite(() => db.doc('csi/' + id).delete()); }
    onProgress?.(++step / steps, monLabel(m));
  }
  const entry = { id: srcId, at, by: S.me.id, file: parsed.fileName, scope: scopeRsm || '', total: parsed.total, added: plan.add.length, updated: plan.upd.length,
    unchanged: plan.same, skipped: plan.skipped + plan.unlistedN, invalid: parsed.errors.length, dupInFile: parsed.dupInFile, months };
  const list = [entry, ...S.uploads].slice(0, 100);
  await retryWrite(() => db.doc('meta/uploads').set({ list }));
  onProgress?.(1, '');
  return entry;
}

  for (const id of ids) await retryWrite(() => S.db.doc('csi/' + id).delete());
  try { await S.db.doc('public/rank_' + m).delete(); } catch (e) {}
  const list = [{ id: uid('x'), at: nowISO(), by: S.me.id, file: '—', action: 'delete', months: [m] }, ...S.uploads].slice(0, 100);

/* calendar: save and (optionally) re-assign the month of every stored record */
async function saveCalendar(doc, remonth, onProgress){

async function rewriteAllMonths(onProgress){
  const at = nowISO();
  const all = S.recs.map(r => { const p = periodOf(r.dd || r.ad); return p.inCal ? { ...r, m: p.m, w: p.w || r.w } : r; });
  const byM = groupBy(all, r => r.m), months = [...byM.keys()].sort(), counts = {};
  let k = 0;
  for (const m of months){
    const parts = encodeMonth(m, byM.get(m), { at, by: S.me.id }); counts[m] = parts.length;
    for (const p of parts) await retryWrite(() => S.db.doc(`csi/${m}_${p.i}`).set(p));
    onProgress?.(++k / (months.length + 1), monLabel(m));
  }
  for (const [id, p] of [...S.parts.entries()]){ const n = counts[p.doc.m]; if (n == null || p.doc.i >= n) await retryWrite(() => S.db.doc('csi/' + id).delete()); }

const rowOf = a => [a.n, ...a.qs.flatMap(q => [q.N, q.H, q.U])];
function rankDoc(m, recs){

  const grp = (arr, tgt) => { for (const [k, rs] of groupBy(arr, r => r.psKey)) tgt[k] = rowOf(agg(rs)); };
  grp(recs, v.all); grp(recs.filter(r => jobOf(r.sp) === 'GR'), v.GR); grp(recs.filter(r => jobOf(r.sp) === 'BP'), v.BP);

function niceStep(x){ const p = Math.pow(10, Math.floor(Math.log10(Math.max(x, 1e-9)))); const f = x/p; return (f<=1?1:f<=2?2:f<=5?5:10)*p; }
function range(a, b, s){ const o = []; for (let v = a; v <= b + 1e-9; v += s) o.push(Math.round(v*100)/100); return o; }
/* items: {key, label, sub, value, segs:[{v,color,title}], color, sel, title} ; o: {act, pct, rot, minW} */
function vbars(items, o = {}){
  if (!items.length) return `<div class="empty">${t('noData')}</div>`;
  let min = 0, max, ticks;
  const vals = items.map(i => i.value ?? 0);
  if (o.pct){ const lo = Math.min(0, ...vals); min = lo < 0 ? Math.floor(lo/25)*25 : 0; max = 100; ticks = range(min, 100, min < 0 ? 25 : 20); }
  else { max = Math.max(1, ...vals); const st = niceStep(max/4); max = Math.ceil(max/st)*st; ticks = range(0, max, st); }
  const y = v => (v - min)/(max - min)*100;
  const grid = ticks.map(tk => `<div class="grid" style="bottom:${y(tk)}%"><span>${tk}</span></div>`).join('');
  const bars = items.map(it => {
    const v = it.value ?? 0, top = y(Math.max(v, 0)), bot = y(Math.min(v, 0));
    const inner = it.segs
      ? `<div class="stack" style="bottom:${bot}%;height:${top-bot}%">${it.segs.filter(s => s.v).map(s => `<i style="height:${s.v/(it.value||1)*100}%;background:${s.color}" title="${esc(s.title||'')}"></i>`).join('')}</div>`
      : `<div class="stack" style="bottom:${bot}%;height:${top-bot}%;background:${it.color || 'var(--accent)'}"></div>`;
    return `<button class="barcol ${it.sel ? 'sel' : ''}" data-act="${o.act}" data-key="${esc(it.key)}" title="${esc(it.title || it.label)}">${inner}<div class="barval" style="bottom:calc(${top}% + 2px)">${it.value == null ? '–' : o.pct ? fmt1(it.value) : it.value}</div></button>`;
  }).join('');
  const xl = items.map(it => o.rot ? `<div><span>${esc(it.label)}</span></div>` : `<div><b>${esc(it.label)}</b>${esc(it.sub || '')}</div>`).join('');
  const minW = Math.max(items.length * (o.minW || 46), 300);
  return `<div class="chartbox"><div class="vchart ${o.rot ? 'rot' : ''}" style="min-width:${minW}px;height:${o.h || (o.rot ? 380 : 280)}px">
    <div class="plot">${grid}${min < 0 ? `<div class="zero" style="bottom:${y(0)}%"></div>` : ''}<div class="bars">${bars}</div></div><div class="xlabels">${xl}</div></div></div>`;
}

/* ---------- PS ranking: from the database in RSM mode, from published per-PS counts (plus the PS's own file) in PS mode ---------- */
function statsFromRow(row){
  const qs = []; for (let i = 0; i < QN; i++){ const N = row[1+i*3], H = row[2+i*3], U = row[3+i*3]; qs.push({ N, H, U, score: N ? (H-U)/N*100 : null }); }
  const cq = qs.slice(0,8).filter(q => q.score != null);
  return { n: row[0], qs, csi: cq.length ? cq.reduce((a,q) => a + q.score, 0)/cq.length : null, nps: qs[8].score };
}
const addRows = (a, b) => a ? a.map((v, i) => v + b[i]) : b.slice();
function rankTable(){
  const mset = F.months, job = F.job || 'all', acc = new Map();
  if (S.mode === 'rsm'){
    for (const [k, rs] of groupBy(scopeRecs({ ignorePS: true, ignoreRSM: true }), r => r.psKey)) acc.set(k, rowOf(agg(rs)));
  } else {
    const own = S.psLocal?.ps, ownMonths = new Set(S.recs.map(r => r.m));
    for (const d of S.ranks.values()){
      if (mset.size && !mset.has(d.m)) continue;
      for (const [k, row] of Object.entries(d.v?.[job] || {})){ if (k === own && ownMonths.has(d.m)) continue; acc.set(k, addRows(acc.get(k), row)); }
    }
    if (own){ const rs = scopeRecs({ ignorePS: true, ignoreRSM: true }); if (rs.length) acc.set(own, addRows(acc.get(own), rowOf(agg(rs)))); }
  }
  const out = new Map(); for (const [k, row] of acc) out.set(k, statsFromRow(row)); return out;
}
function rankIn(tbl, key, get){
  const me = tbl.get(key), mv = me ? get(me) : null; if (mv == null) return null;
  let better = 0, of = 0; for (const s of tbl.values()){ const v = get(s); if (v == null) continue; of++; if (v > mv + 1e-9) better++; }
  return { rank: better + 1, of, v: mv };
}
function rankBundle(key){
  const tbl = rankTable(); if (!key || !tbl.has(key)) return null;
  return { csi: rankIn(tbl, key, s => s.csi), nps: rankIn(tbl, key, s => s.nps), q: [...Array(QN)].map((_, i) => rankIn(tbl, key, s => s.qs[i].score)) };
}
function rkCircle(r, label, sub){

  const f = r.rank / r.of, tier = r.rank <= 3 ? 'top' : f <= .34 ? 'good' : f <= .67 ? 'mid' : 'low';
  return `<div class="rkc ${tier}" title="${esc(label)}: ${fmt1(r.v)} · ${t('rk.rank')} ${r.rank}/${r.of}"><div class="ring"><b>${r.rank}</b><small>/${r.of}</small></div><span>${esc(label)}${sub ? `<i>${esc(sub)}</i>` : ''}</span></div>`;
}

function donut(dist, N, key){
  if (!N) return `<svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="44" fill="none" stroke="var(--surface-2)" stroke-width="22"/></svg>`;
  let a0 = -Math.PI/2; const R = 56, r = 33, cx = 60, cy = 60;
  const paths = dist.map((c, i) => {
    if (!c) return '';
    const frac = c/N; const a1 = a0 + frac*Math.PI*2; const large = frac > .5 ? 1 : 0;
    const p = frac >= .9999
      ? `M ${cx} ${cy-R} A ${R} ${R} 0 1 1 ${cx-0.01} ${cy-R} L ${cx-0.01} ${cy-r} A ${r} ${r} 0 1 0 ${cx} ${cy-r} Z`
      : `M ${cx+R*Math.cos(a0)} ${cy+R*Math.sin(a0)} A ${R} ${R} 0 ${large} 1 ${cx+R*Math.cos(a1)} ${cy+R*Math.sin(a1)} L ${cx+r*Math.cos(a1)} ${cy+r*Math.sin(a1)} A ${r} ${r} 0 ${large} 0 ${cx+r*Math.cos(a0)} ${cy+r*Math.sin(a0)} Z`;
    a0 = a1;
    return `<path d="${p}" fill="${SC_COLOR(i+1)}" data-act="pie" data-key="${key}:${i+1}" tabindex="0" role="button" aria-label="${t('score')} ${i+1}: ${c}"><title>${t('score')} ${i+1}: ${c} (${(frac*100).toFixed(1)}%)</title></path>`;
  }).join('');
  return `<svg viewBox="0 0 120 120">${paths}</svg>`;
}

function dataRows(){
  const s = F.data.search.trim().toLowerCase(), qf = F.data.q === '' ? -1 : +F.data.q;
  let rows = scopeRecs().filter(r => {
    if (qf >= 0 && !(r.s[qf] && (F.scores.has(r.s[qf])))) return false;
    if (F.data.onlySel && qf < 0 && !r.s.some(x => x && F.scores.has(x))) return false;
    if (F.data.onlyCmt && !(r.c.some(Boolean) || r.o)) return false;
    if (s){ const hay = `${r.sp} ${r.vin} ${r.ps} ${rsmOf(r.psKey)} ${r.item} ${r.nm} ${r.c.join(' ')} ${r.o}`.toLowerCase(); if (!hay.includes(s)) return false; }
    return true;
  });
  const k = F.data.sort, d = F.data.dir === 'asc' ? 1 : -1;
  const val = r => k === 'min' ? minScore(r)*1000 + (recCsiC(r) ?? 0) : k === 'date' ? (r.dd || r.ad) : k === 'ps' ? r.ps : k === 'rsm' ? rsmOf(r.psKey) || '~' : k === 'sp' ? r.sp : k === 'csi' ? (recCsiC(r) ?? 999) : k.startsWith('q') ? (r.s[+k.slice(1)] || 9) : 0;
  rows.sort((a,b) => { const x = val(a), y = val(b); return d * (typeof x === 'string' ? x.localeCompare(y) : x - y) || (b.dd||'').localeCompare(a.dd||''); });
  return rows;
}
const csiCache = new WeakMap();

/* ---------- global search ---------- */
function searchRecs(q){
  q = q.trim().toUpperCase().replace(/\s+/g,''); if (q.length < 3) return [];
  const out = []; for (const r of S.recs){ if (r.sp.replace(/-/g,'').includes(q.replace(/-/g,'')) || (r.vin && r.vin.includes(q))) { out.push(r); if (out.length > 30) break; } }
  return out;
}
function renderSearchResults(){
  const box = $('gresults'), q = $('gsearch').value;

  const ps = [...groupBy(scopeRecs({ ignorePS: true }), r => r.psKey).entries()].map(([k, rs]) => { const q = agg(rs).qs[qi]; return { k, name: psName(k, rs[0].ps), rsm: rsmOf(k), q }; }).filter(p => p.q.N).sort((a,b) => b.q.badPct - a.q.badPct || a.q.score - b.q.score);
  openModal(`Q${qi+1} · ${esc(qShort(qi))}`, `${esc(qFull(qi))} · ${t('qd.sub')}`,
    `<div class="tblwrap" style="max-height:62vh"><table class="t"><thead><tr><th>PS</th><th>RSM</th><th class="r">N</th><th class="r">1</th><th class="r">2</th><th class="r">3</th><th class="r">4</th><th class="r">5</th><th class="r">${t('m.bad')}</th><th class="r">${t('score')}</th></tr></thead><tbody>

function planDocs(){
  if (isAdminView()) return [...S.plansDocs.entries()];
  return S.myPlanDoc && S.me.id ? [[S.me.id, S.myPlanDoc]] : [];
}
function allPlans(){
  const out = [];
  for (const [docId, d] of planDocs()) for (const p of Object.values(d.items || {})) if (p && p.id) out.push({ ...p, state: 'submitted', review: undefined, doc: docId, ps: p.ps || d.ps, psName: p.psName || d.psName });
  return out.filter(p => isAdminView() || !S.psLocal || p.ps === S.psLocal.ps).sort((a,b) => (b.updatedAt||'').localeCompare(a.updatedAt||''));
}
const plansFor = psKey => allPlans().filter(p => p.ps === psKey);
const isOverdue = p => p.status !== 'done' && p.due && p.due < todayISO() && p.state === 'submitted';
function statusPill(p){
  if (p.state === 'draft') return `<span class="pill mute">${t('st.draft')}</span>`;
  if (isOverdue(p)) return `<span class="pill bad">${t('st.overdue')}</span>`;
  return `<span class="pill ${p.status === 'done' ? 'good' : p.status === 'inProgress' ? 'info' : 'warn'}">${t('st.' + (p.status || 'notStarted'))}</span>`;
}
function reviewPill(p){
  return '';
  if (p.state !== 'submitted') return '';
  const s = p.review?.status || 'pending';
  return `<span class="pill ${s === 'approved' ? 'good' : s === 'revise' ? 'bad' : 'mute'}">${t('rv.' + s)}</span>`;
}

function canEditPlan(p){ return !isAdminView() && p.doc === S.me.id; }
const isRsmAdmin = () => isAdminView() && !!S.me.canEdit;

  const d = new Date(iso); if (isNaN(d)) return iso || '';

async function reviewPlan(status){
  const [docId, id] = ($('modalRoot').dataset.plan || '').split('|'); const p = findPlan(docId, id); if (!p) return;
  const comment = $('rvComment').value.trim();
  if (status === 'revise' && !comment) return toast(t('rv.needComment'));
  const entry = { at: nowISO(), by: S.me.id, who: S.me.name || '', status, note: comment };
  try {
    await mutatePlanDoc(docId, d => { const it = d.items[id]; it.review = { status, comment, by: S.me.id, at: entry.at, log: [...(it.review?.log || []), entry] }; });
    toast(t('saved2')); closeModal();
  } catch (e){ toast(dbErrMsg(e)); }
}
/* whole-document read-modify-write so items / history lines can really be removed */
async function mutatePlanDoc(docId, fn){
  const ref = S.db.doc('plans/' + docId), s = await ref.get(); if (!s.exists) throw { code: 'not_found' };
  const d = s.data(); fn(d); d.updatedAt = nowISO(); await retryWrite(() => ref.set(d));
}
async function deletePlan(docId, id){

}

async function deleteHist(docId, id, kind, i){

  } catch (e){ toast(dbErrMsg(e)); }

function armBtn(el, fn){

  el.dataset.armed = '1'; const old = el.textContent; el.textContent = t('pl.deleteSure');

/* images: shrunk before saving so they stay readable but light */
async function shrinkImage(file, max = 1280, q = 0.72){
  try {
    const bm = await createImageBitmap(file); const sc = Math.min(1, max / Math.max(bm.width, bm.height));
    const w = Math.round(bm.width * sc), h = Math.round(bm.height * sc), c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); g.drawImage(bm, 0, 0, w, h);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', q)); if (!blob) return file;
    return new File([blob], file.name.replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' });
  } catch (e){ return file; }
}

}

const TEXT_FIELDS = ['problem', 'cause', 'action', 'escCause', 'escPrev'];
async function savePlan(state){
  const [docId0, id0] = ($('modalRoot').dataset.plan || '').split('|');
  const old = id0 ? findPlan(docId0, id0) : null;
  if (!old && !S.psLocal) return toast(t('pl.needFile'));

  const q = [...document.querySelectorAll('#planForm [data-act="pfQ"][aria-pressed="true"]')].map(b => +b.dataset.key);
  const val = {
    problem: $('pfProblem').value.trim(), q, sps: $('pfSps').value.split(/[\s,;]+/).map(s => s.trim().toUpperCase()).filter(Boolean),
    cause: $('pfCause').value.trim(), action: $('pfAction').value.trim(), escCause: $('pfEscCause').value.trim(), escPrev: $('pfEscPrev').value.trim(),
    owner: $('pfOwner').value.trim(), due: $('pfDue').value, status: $('pfStatus').value, images: formImages, months: formMonths,
  };
  const ps = old ? old.ps : S.psLocal.ps, psNm = old ? old.psName : S.psLocal.name, docId = old ? old.doc : S.me.id;
  if (!val.problem) return toast(t('pl.needProblem'));
  const finalState = 'submitted';
  const at = nowISO(), id = old ? old.id : uid('p');
  let act, note = '';
  const diff = {}; for (const k of TEXT_FIELDS) if ((old?.[k] || '') !== (val[k] || '') && val[k]) diff[k] = val[k].slice(0, 400);
  if (!old) act = 'created';
  else {
    const ch = [...TEXT_FIELDS, 'owner', 'due', 'status'].filter(k => (old[k]||'') !== (val[k]||''));
    if (JSON.stringify(old.q||[]) !== JSON.stringify(q)) ch.push('qs'); if (JSON.stringify(old.sps||[]) !== JSON.stringify(val.sps)) ch.push('sps'); if ((old.images||[]).length !== formImages.length) ch.push('images');
    if (!ch.length){ closeModal(); return; }
    act = ch.includes('status') ? 'status' : 'edited';
    note = ch.map(k => t('f.' + k)).join(', ') + (ch.includes('status') ? ` → ${t('st.' + val.status)}` : '');
  }
  const who = S.me.name || S.psLocal?.name || '';
  const plan = { ...val, id, ps, psName: psNm, state: finalState, updatedAt: at, updatedBy: S.me.id,
    createdAt: old?.createdAt || at, createdBy: old?.createdBy || S.me.id, history: [...(old?.history || []), { at, by: S.me.id, who, act, note, diff }].slice(-60) };
  busy(true, t('saving'));
  try {
    const ref = S.db.doc('plans/' + docId), s = await ref.get(), cur = s.exists ? s.data() : { items: {} };
    cur.ps = ps; cur.psName = psNm; cur.owner = S.me.id; cur.items = { ...(cur.items || {}), [id]: plan }; cur.updatedAt = at; if (!cur.createdAt) cur.createdAt = at;
    await retryWrite(() => ref.set(cur));
    busy(false); closeModal(); toast(t('saved2'));
  } catch (e){ busy(false); toast(dbErrMsg(e)); }
}

  const monthly = [...groupBy(recs, r => r.m).entries()].sort((a,b) => a[0].localeCompare(b[0])).map(([m, rs]) => ({ m, a: agg(rs) }));

/* ranking of one PS inside the whole network for the report's own month / job selection */

/* ---------- PDF ---------- */
function relTop(n, root){ let y = 0; while (n && n !== root){ y += n.offsetTop; n = n.offsetParent; } return y; }
function reportFileBase(M){ return `CSI_Report_${(M.scopeName || 'All').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_|_$/g,'') || 'Report'}_${todayISO()}`; }
async function exportPdf(){
  busy(true, t('rp.making'));
  try {
    await Promise.all([loadScript(LIBS.h2c), loadScript(LIBS.pdf)]);
    const M = buildModel(); $('rpScroll').innerHTML = reportHtml(M);
    await document.fonts.ready;
    const el = $('rpt');
    await Promise.all([...el.querySelectorAll('img')].map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; })));
    const W = el.offsetWidth, Ht = el.offsetHeight, scale = 2;
    const canvas = await html2canvas(el, { scale, backgroundColor: '#ffffff', logging: false, useCORS: true });
    const pageH = W * 277 / 210;
    const cands = [...el.querySelectorAll('.rb, tbody tr:not(:first-child), li:not(:first-child), .r-plan, .r-pie, .r-two, .r-foot, h4, img.chart')].map(n => relTop(n, el)).filter(y => y > 0).sort((a,b) => a - b);
    const pages = []; let s = 0;
    while (s < Ht - 1){ let e = s + pageH; if (e >= Ht) e = Ht; else { const c = cands.filter(y => y > s + pageH*0.35 && y <= e); if (c.length) e = c[c.length-1]; } pages.push([s, e]); s = e; }
    const pdf = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4' });
    const ascii = (M.scopeName || '').replace(/[^\x20-\x7E]/g, '').trim();
    pages.forEach(([s0, e0], i) => {
      if (i) pdf.addPage();
      const c = document.createElement('canvas'); c.width = canvas.width; c.height = Math.max(1, Math.round((e0 - s0)*scale));
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(canvas, 0, Math.round(s0*scale), canvas.width, c.height, 0, 0, canvas.width, c.height);
      pdf.addImage(c.toDataURL('image/jpeg', 0.9), 'JPEG', 0, 10, 210, (e0 - s0)*210/W);
      pdf.setFontSize(8); pdf.setTextColor(110); pdf.text(`CSI Report${ascii ? ' · ' + ascii : ''} · Created by Natchanon C.`, 12, 291); pdf.text(`${i+1} / ${pages.length}`, 198, 291, { align: 'right' });
    });
    busy(false);
    await saveFile(reportFileBase(M) + '.pdf', pdf.output('arraybuffer'), 'application/pdf');
  } catch (e){ console.error(e); busy(false); toast(t('rp.err')); }
}

function dataUrlBytes(u){ const b = atob(u.split(',')[1]); const a = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
async function imageBytes(url){
  const res = await fetch(url); const blob = await res.blob();
  const bm = await createImageBitmap(blob).catch(() => null);
  let w = bm?.width || 400, h = bm?.height || 300;
  let bytes = new Uint8Array(await blob.arrayBuffer());
  if (!/png|jpe?g|gif|bmp/i.test(blob.type) && bm){ const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(bm, 0, 0); bytes = dataUrlBytes(c.toDataURL('image/png')); }
  return { bytes, w, h };
}

/* ================= one upload box: the file format decides RSM vs PS ================= */
async function handleFile(f){
  if (!f) return;
  if (typeof XLSX === 'undefined') return toast(t('err.xlsx'));
  busy(true, t('ad.reading', { f: f.name }));
  let parsed;
  try { parsed = parseCsiWorkbook(XLSX.read(await f.arrayBuffer(), { type: 'array' }), f.name); }
  catch (e){ console.error(e); busy(false); return toast(e.message || t('err.read')); }
  busy(false);
  const kind = detectKind(parsed);
  if (!parsed.recs.length && !(kind === 'rsm' && S.me.canEdit)){ const e0 = parsed.errors[0]; return toast(t('up.noValid') + (e0 ? ` (${t('ad.line')} ${e0.line}: ${e0.reason})` : '')); }
  if (kind === 'rsm'){
    if (!S.me.canEdit) return toast(t('up.rsmDenied'));
    S.mode = 'rsm'; S.psLocal = null; applyView();
    UP.parsed = parsed; UP.plan = planImport(parsed, UP.scope); F.ps = ''; F.tab = 'admin';
  } else {
    const r0 = parsed.recs[0];
    S.psLocal = { file: f, ps: r0.psKey, name: psName(r0.psKey, r0.ps), fileName: f.name, recs: parsed.recs, errors: parsed.errors, skipped: parsed.skippedRows.length, dup: parsed.dupInFile, total: parsed.total };
    S.mode = 'ps'; applyView(); F.ps = r0.psKey; F.rsm.clear(); F.months = new Set(); F.tab = 'dash'; UP.parsed = null;
    toast(t('up.psLoaded', { n: parsed.recs.length.toLocaleString(), p: esc(S.psLocal.name) }));
  }
  closeModal(); renderAll(); window.scrollTo({ top: 0 });
}
function backToRsm(){ S.mode = 'rsm'; S.psLocal = null; applyView(); F.ps = ''; F.tab = 'dash'; renderAll(); }
/* panel shown on the PS dashboard: what was read from the file, and what was left out */
function psFileInfo(){
  const P = S.psLocal; if (!P) return '';
  const bad = P.errors.length;
  return `<div class="banner info" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><span><b>${esc(P.fileName)}</b> · ${t('up.psRead', { v: P.recs.length.toLocaleString(), r: P.total.toLocaleString() })}${P.skipped ? ' · ' + t('up.skippedRows', { n: P.skipped }) : ''}${P.dup ? ' · ' + t('ad.dupFile') + ' ' + P.dup : ''}</span>
    ${bad ? `<details style="flex:1"><summary class="small">${t('ad.errors', { n: bad })}</summary><div class="tblwrap" style="max-height:180px;margin-top:6px"><table class="t"><thead><tr><th>${t('ad.line')}</th><th>SP</th><th>${t('ad.reason')}</th></tr></thead><tbody>${P.errors.slice(0, 100).map(e => `<tr><td class="num">${e.line}</td><td class="mono">${esc(e.sp)}</td><td>${esc(e.reason)}</td></tr>`).join('')}</tbody></table></div></details>` : ''}
    <span class="small muted">${t('up.notSaved')}</span></div>`;
}

it,minmax(170px,1fr));gap:8px 16px;font-size:13px}\n.meta div span{display:block;font-size:11.5px;color:var(--muted)}\n.qlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}\n.qitem{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:10px 12px;border-bottom:1px solid var(--line);align-items:start}\n.qitem:last-child{border-bottom:0}\n.qitem .qc{grid-column:2;font-size:13px;color:var(--bad)}\n.other{background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:13px}\n\n/* drop overlay + toast */\n.dropzone{position:fixed;inset:0;z-index:60;background:color-mix(in srgb,var(--accent) 22%,transparent);display:grid;place-items:center;pointer-events:none}\n.dropzone div{background:var(--surface);border:2px dashed var(--accent);border-radius:16px;padding:36px 48px;font-family:var(--f-display);font-size:20px;font-weight:700;text-align:center}\n.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13.5px;max-width:calc(100% - 32px)}\n.dropcard{border:2px dashed var(--accent);background:var(--accent-soft);border-radius:14px;padding:28px 20px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;cursor:pointer;color:var(--fg)}\n.dropcard:hover{filter:brightness(1.03)}\n.dc-title{font-family:var(--f-display);font-size:19px;font-weight:700;color:var(--accent)}\n.empty{padding:24px;text-align:center;color:var(--muted)}\n@media (prefers-reduced-motion:reduce){.stack{transition:none}}\n@media (max-width:700px){.filters{position:static}}\n@media (max-width:560px){.flabel{min-width:0;width:100%}.kpi .val{font-size:26px}}\n\n/* ---------- report (a printed document: always light) ---------- */\n:root{--r-ink:#16202c;--r-muted:#5a6878;--r-line:#d5dce5;--r-soft:#f1f4f8;--r-accent:#1f4f82;--r-accent-soft:#e3ecf6;--r-good:#16834a;--r-warn:
